<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciné</title>
<meta name="description" content="Toutes les séances des cinémas parisiens qui acceptent la carte UGC Illimité.">
<meta name="theme-color" content="#1B2A4E">
<link rel="manifest" href="manifest.webmanifest">
<script>  // thème sombre par défaut, avant l'affichage pour éviter un flash clair
  try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("theme")) || "dark"; }
  catch { document.documentElement.dataset.theme = "dark"; }
</script>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciné">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --enamel: #1B2A4E;      /* bleu émail des plaques parisiennes */
  --enamel-ink: #FFFFFF;
  --page: #E8EDF4;        /* gris-bleu froid */
  --surface: #FFFFFF;
  --ink: #16203A;
  --muted: #5B6680;
  --line: #CDD5E2;
  --ticket: #F2C230;      /* jaune « ticket » pour la prochaine séance */
  --ticket-ink: #1B2A4E;
  --ugc: #C9283A;
  --mk2: #222A3A;
  --indep: #23785A;
  --past: #A9B2C3;
  --focus: #2F6BFF;
  --radius-chip: 6px;
  --radius-sheet: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --enamel: #0F1A33; --page: #0B1326; --surface: #15203A; --ink: #E9EEF7;
    --muted: #93A0BA; --line: #26324D; --past: #4A5672; --mk2: #8E9AB3; --ugc: #FF6170; --indep: #4DC596; --focus: #8AB0FF;
  }
}
:root[data-theme="dark"] {
  --enamel: #0B0F1A; --page: #07090F; --surface: #131826; --ink: #EEF1F7;
  --muted: #8E97AD; --line: #232A3B; --past: #4A5268; --mk2: #9AA5BE; --ugc: #FF5A6A; --indep: #4DC596; --focus: #8AB0FF;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 400 16px/1.45 "Barlow", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.cond { font-family: "Barlow Condensed", "Barlow", sans-serif; }
.app { max-width: 640px; margin: 0 auto; min-height: 100dvh; }

/* --- Bandeau émail --- */
.plate {
  background: var(--enamel); color: var(--enamel-ink);
  padding: calc(env(safe-area-inset-top) + 14px) 16px 16px;
  position: sticky; top: 0; z-index: 5;
  border-bottom: 3px solid var(--ticket);
}
.plate h1 {
  margin: 0 0 10px; font: 700 26px/1 "Barlow Condensed", sans-serif; letter-spacing: .01em;
  display: flex; align-items: center; gap: 10px;
}
.plate h1 .back {
  border: 0; background: none; padding: 4px 6px 4px 0; display: none; color: inherit; font-size: 26px; line-height: 1;
}
.app.film-mode .plate h1 .back { display: inline-block; }
/* Sur la fiche d'un film, on masque la recherche pour laisser la place aux séances. */
.app.film-mode .search { display: none; }
.app.film-mode .days { margin-top: 0; }
.search {
  display: flex; align-items: center; gap: 8px; background: #fff; color: #16203A;
  border-radius: 10px; padding: 0 12px; height: 46px;
}
.search input { flex: 1; border: 0; outline: 0; background: none; font-size: 17px; min-width: 0; }
.search svg { flex: none; opacity: .55; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }  /* on a déjà notre ✕ */
.search .clear { border: 0; background: none; padding: 6px; font-size: 18px; opacity: .5; display: none; }
.search.has-text .clear { display: block; }

.days {
  display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px;
  scrollbar-width: none;
}
.days::-webkit-scrollbar { display: none; }
.day {
  flex: none; border: 1.5px solid rgba(255,255,255,.35); background: none; color: #fff;
  border-radius: var(--radius-chip); padding: 5px 10px; text-align: center; min-width: 54px;
  font-family: "Barlow Condensed", sans-serif;
}
.day b { display: block; font-size: 19px; font-weight: 600; line-height: 1.05; }
.day span { font-size: 13px; opacity: .8; }
.day[aria-pressed="true"] { background: var(--ticket); color: var(--ticket-ink); border-color: var(--ticket); }

/* --- Filtres --- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px 4px; }
@media (max-width: 360px) { .filters { gap: 5px; padding-left: 12px; padding-right: 12px; } .filters .chip { padding: 6px 9px; font-size: 13px; } }
.statusrow { display: flex; align-items: center; justify-content: space-between; padding-right: 10px; }
.statusrow .status { padding-top: 0; }
.layoutbtn { border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 4px 6px; white-space: nowrap; }
#filtersCount { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 6px; border-radius: 99px;
  background: var(--ticket); color: var(--ticket-ink); font-size: 12px; font-weight: 700; vertical-align: 1px; }
#filtersCount:empty { display: none; }
.activef { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 0; }
.activef:empty { display: none; }
.pill { border: 0; border-radius: 999px; padding: 4px 10px; background: var(--ticket); color: var(--ticket-ink); font-size: 13px; font-weight: 600; }
.fopts { display: flex; flex-wrap: wrap; gap: 8px; }
.fopts.arrs { display: grid; grid-template-columns: repeat(5, 1fr); }
.fopt { border: 1.5px solid var(--line); background: var(--page); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 500; }
.fopts.arrs .fopt { padding: 8px 0; }
.fopt[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.fsheet-foot { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 16px 0 4px; background: var(--surface); }
.fsheet-foot button { flex: 1; border: 0; border-radius: 10px; padding: 12px; font: 600 15px "Barlow", sans-serif; }
.fsheet-foot .ghost { flex: none; background: var(--page); color: var(--ink); }
.fsheet-foot .primary { background: var(--ticket); color: var(--ticket-ink); }
#fsheetBody { padding: 0 16px 8px; }
#fsheetBody .list-sep:first-child { margin-top: 4px; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 13px; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.chip select { border: 0; background: none; appearance: none; -webkit-appearance: none; padding-right: 2px; }

.status { padding: 6px 16px 0; font-size: 13px; color: var(--muted); }

/* --- Liste des films --- */
.films { list-style: none; margin: 0; padding: 8px 16px 32px; display: grid; gap: 2px; }
.film-row {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center;
  width: 100%; border: 0; background: var(--surface); text-align: left; padding: 10px 12px 10px 10px;
}
.films li:first-child .film-row { border-radius: 12px 12px 0 0; }
.films li:last-child .film-row { border-radius: 0 0 12px 12px; }
.films li:only-child .film-row { border-radius: 12px; }
.list-sep { margin: 14px 16px 0; font: 600 13px "Barlow", sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.list-sep + .films { padding-top: 6px; }
.poster {
  width: 64px; aspect-ratio: 2/3; border-radius: 4px; background: var(--line) center/cover no-repeat;
  display: grid; place-items: center; color: var(--muted); font: 600 20px "Barlow Condensed";
}
.film-row h2 { margin: 0; font: 600 20px/1.1 "Barlow Condensed", sans-serif; }
.badge {
  display: inline-block; margin-bottom: 3px; padding: 2px 7px 1px; border-radius: 4px;
  background: var(--ticket); color: var(--ticket-ink); font: 600 12px/1.3 "Barlow", sans-serif;
  text-transform: uppercase; letter-spacing: .04em;
}
.film-row p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.next { text-align: right; font-family: "Barlow Condensed"; line-height: 1.1; }
.next b { display: block; font-size: 20px; font-weight: 600; }
.next small { font-size: 12px; color: var(--muted); }

/* --- Fiche film --- */
.film-head { display: grid; grid-template-columns: 120px 1fr; gap: 14px; padding: 16px; align-items: end; }
.film-head .poster { width: 120px; border-radius: 8px; font-size: 32px; }
.film-head h2 { margin: 0; font: 700 30px/1.02 "Barlow Condensed", sans-serif; }
.film-head p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.film-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 8px; }
.film-head .ext { font-size: 14px; font-weight: 600; color: var(--focus); text-decoration: none; }
.copyicon { border: 0; background: none; color: inherit; opacity: .7; padding: 4px 6px; margin-left: 4px; vertical-align: 3px; line-height: 0; cursor: pointer; }
.copyicon:active { opacity: 1; }
.seenbtn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; }
.seenbtn[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.badge.seen { background: var(--line); color: var(--ink); margin-right: 4px; }
.film-row.is-seen { opacity: .6; }

/* Vue affiches : 3 colonnes */
.films.grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px; }
.films.grid li .film-row { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 0; background: none; border-radius: 0; position: relative; }
.films.grid .poster { width: 100%; border-radius: 8px; font-size: 34px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.films.grid .film-row > div:nth-child(2) { min-width: 0; }
.films.grid h2 { font-size: 16px; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.films.grid p { display: none; }
.films.grid .badge { position: absolute; top: 6px; left: 6px; font-size: 10px; margin: 0; z-index: 1; }
.films.grid .badge.seen { display: none; }  /* l'affiche grisée suffit */
.pwrap { position: relative; }
.films.grid .next { text-align: left; display: flex; gap: 5px; align-items: baseline; }
.films.grid .next b { font-size: 16px; }
.films.grid .next small { font-size: 11px; }
.films.grid .rate { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,.72); color: #fff; border-radius: 4px; padding: 1px 5px; font: 600 12px "Barlow", sans-serif; }
.films:not(.grid) .rate { display: none; }

/* Fiche film : affiche floutée en fond */
.film-head.hero { position: relative; overflow: hidden; color: #fff; padding-top: 28px; }
.film-head.hero::before { content: ""; position: absolute; inset: -30px; background: var(--bg) center/cover; filter: blur(26px) brightness(.42) saturate(1.2); z-index: 0; }
.film-head.hero > * { position: relative; z-index: 1; }
.film-head.hero p { color: rgba(255,255,255,.78); }
.film-head.hero .ext { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
.film-head.hero .seenbtn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.35); color: #fff; }
.film-head.hero .seenbtn[aria-pressed="true"] { background: #fff; color: #111; }
.film-head.hero .poster { box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.view-toggle { display: flex; margin: 0 16px; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.view-toggle button { flex: 1; border: 0; background: var(--surface); padding: 8px; font-size: 14px; font-weight: 600; }
.view-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--page); }

.cinemas { list-style: none; margin: 0; padding: 12px 16px 40px; display: grid; gap: 10px; }
.cine { background: var(--surface); border-radius: 12px; padding: 12px; }
.cine-top { display: flex; align-items: center; gap: 10px; }
.arr {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font: 700 15px "Barlow Condensed"; color: #fff; background: var(--indep);
}
.arr.UGC { background: var(--ugc); }
.arr.MK2 { background: var(--mk2); }
.cine-name { flex: 1; min-width: 0; }
.cine-name h3 { margin: 0; font: 600 19px/1.1 "Barlow Condensed"; }
.cine-name a { color: var(--muted); font-size: 13px; text-decoration: none; }
.cine-name a:hover { text-decoration: underline; }
.star { border: 0; background: none; padding: 6px; font-size: 20px; color: var(--muted); line-height: 1; }
.star[aria-pressed="true"] { color: #E0A800; }
.times { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.time {
  font-family: "Barlow Condensed"; font-size: 18px; font-weight: 600; line-height: 1;
  padding: 7px 9px 6px; border-radius: var(--radius-chip); border: 1.5px solid var(--line);
  display: inline-flex; align-items: baseline; gap: 5px;
}
a.time { color: inherit; text-decoration: none; }
.time small { font-size: 12px; font-weight: 500; color: var(--muted); }
.time.vf { border-style: dashed; }
.time.soon { background: var(--ticket); border-color: var(--ticket); color: var(--ticket-ink); }
.time.soon small { color: var(--ticket-ink); }
.time.past { color: var(--past); border-color: transparent; text-decoration: line-through; }
.time.past small { color: var(--past); }

.time .end { font-style: normal; font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 1px; }
.time.soon .end { color: var(--ticket-ink); opacity: .75; }
.cine-name .dist { display: block; font-size: 12px; color: var(--muted); }
.cine-name .dist a { font-size: 12px; color: var(--focus); font-weight: 500; }
.pastlink { display: block; margin: 10px 16px 0; border: 0; background: none; padding: 4px 0; color: var(--focus); font-size: 14px; font-weight: 500; text-decoration: underline; }

/* Vue chronologique */
.timeline { list-style: none; margin: 0; padding: 12px 16px 40px; }
.timeline li { border-bottom: 1px solid var(--line); }
.timeline .row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; align-items: center; color: inherit; text-decoration: none; }
.timeline .go { margin-left: auto; padding-left: 4px; font-size: 22px; line-height: 1; color: var(--muted); }
.timeline .when { font: 600 22px/1 "Barlow Condensed"; }
.timeline .when.past { color: var(--past); }
.timeline .when small { display: block; font: 500 12px/1.3 "Barlow", sans-serif; color: var(--muted); margin-top: 2px; }

.timeline .where { display: flex; gap: 8px; align-items: center; min-width: 0; }
.timeline .where span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timeline .arr { width: 24px; height: 24px; font-size: 13px; }

.legend { margin: 10px 16px 0; font-size: 12px; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

.empty { padding: 48px 24px; text-align: center; color: var(--muted); }
.empty h2 { color: var(--ink); font: 600 22px "Barlow Condensed"; margin: 0 0 6px; }

.install {
  margin: 12px 16px 0; background: var(--surface); border-radius: 12px; padding: 12px 14px;
  display: none; gap: 10px; align-items: center; font-size: 14px;
}
.install.show { display: flex; }
.install p { margin: 0; flex: 1; }
.install button { border: 0; background: var(--enamel); color: #fff; border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.install .x { background: none; color: var(--muted); padding: 6px; }

/* --- Cinémas : recherche et page d'une salle --- */
.cinehits { list-style: none; margin: 0; padding: 6px 16px 0; display: grid; gap: 6px; }
.cinehits a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); color: inherit; text-decoration: none; }
.cinehits span:not(.arr) { flex: 1; min-width: 0; }
.cinehits .arr { flex: none; }
.cinehits b { display: block; font: 600 18px/1.15 "Barlow Condensed", sans-serif; }
.cinehits small { color: var(--muted); font-size: 13px; }
.cinehits i { font-style: normal; color: var(--muted); font-size: 20px; }
.cinelink { color: inherit; text-decoration: none; }
.cine-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 16px 6px; }
.cine-head .arr.big { width: 44px; height: 44px; font-size: 20px; }
.cine-head h2 { margin: 0; font: 700 28px/1.05 "Barlow Condensed", sans-serif; }
.cine-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.cine-head .cine-name { flex: 1; min-width: 0; }
.cf-head { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; width: 100%; border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.cf-head .poster { width: 40px; font-size: 16px; }
.cf-head h3 { margin: 0; font: 600 19px/1.1 "Barlow Condensed", sans-serif; }
.cf-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.cf-head b { color: var(--muted); font-size: 20px; }

/* --- Feuille d'actions (séance) --- */
.timeline li.tl { display: flex; align-items: center; }
.timeline li.tl > .row { flex: 1; min-width: 0; }
.timeline .more { flex: none; border: 0; background: none; color: var(--muted); font-size: 22px; padding: 6px 2px 6px 10px; line-height: 1; }
.legend .hint { border: 0; background: none; padding: 0; color: var(--focus); font-size: 12px; font-weight: 600; }
dialog.sheet {
  width: 100%; max-width: 640px; max-height: 88dvh; margin: auto auto 0; border: 0; padding: 0 0 calc(env(safe-area-inset-bottom) + 12px);
  border-radius: 18px 18px 0 0; background: var(--surface); color: var(--ink);
}
dialog.sheet::backdrop { background: rgba(0,0,0,.55); }
dialog.sheet .card-top h2 { font-size: 22px; line-height: 1.05; }
#sheetBody { padding: 0 16px 8px; }
.sheet-sub { margin: 0; color: var(--muted); font-size: 14px; }
.card-actions .btn { border-radius: 10px; padding: 11px 16px; font: 600 15px "Barlow", sans-serif; background: var(--ticket); color: var(--ticket-ink); text-decoration: none; }
dialog.sheet .card-actions button.ghost { background: var(--page); color: var(--ink); }
dialog.sheet .list-sep { margin: 20px 0 6px; }
.pairs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pairs a { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; color: inherit; text-decoration: none; padding: 6px; border-radius: 10px; background: var(--page); }
.pairs .poster { width: 44px; font-size: 18px; }
.pairs b { display: block; font: 600 17px/1.1 "Barlow Condensed", sans-serif; }
.pairs span, .pairs small { display: block; font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); font-size: 14px; }

/* --- Envies --- */
.chip.discover { background: var(--ticket); color: var(--ticket-ink); border-color: var(--ticket); font-weight: 600; }
.wishmark { position: absolute; top: 4px; right: 6px; color: #FF5A6A; font-size: 18px; text-shadow: 0 1px 4px rgba(0,0,0,.6); z-index: 1; }
.films:not(.grid) .pwrap .wishmark { top: -4px; right: -4px; font-size: 16px; }

/* --- Découverte --- */
dialog.disc { width: 100%; max-width: 640px; height: 100dvh; max-height: none; margin: 0 auto; border: 0; padding: 0; background: #07090F; color: #EEF1F7; overflow: hidden; }
dialog.disc::backdrop { background: #000; }
dialog.disc .card-top { gap: 10px; }
#discCount { color: #8E97AD; font-size: 14px; }
#discBody { padding: 4px 20px 20px; display: flex; flex-direction: column; height: calc(100% - 70px); }
#discBody .empty h2 { color: #EEF1F7; }
.disc-card { flex: 1; min-height: 0; display: flex; flex-direction: column; touch-action: pan-y; user-select: none; --like: 0; --nope: 0; }
.disc-poster { position: relative; flex: 1; min-height: 0; border-radius: 16px; background: #1A2030 center/cover no-repeat; box-shadow: 0 16px 40px rgba(0,0,0,.6);
  display: grid; place-items: center; font: 700 72px "Barlow Condensed", sans-serif; color: #8E97AD; }
.disc-poster .badge { position: absolute; top: 12px; left: 12px; }
.disc-poster .rate { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,.75); color: #fff; border-radius: 6px; padding: 3px 8px; font: 600 16px "Barlow", sans-serif; }
.stamp { position: absolute; top: 28px; padding: 4px 12px; border: 4px solid; border-radius: 8px; font: 700 34px "Barlow Condensed", sans-serif; letter-spacing: .05em; transform: rotate(-12deg); }
.stamp.like { left: 22px; color: #4DC596; opacity: var(--like); }
.stamp.nope { right: 22px; color: #FF5A6A; opacity: var(--nope); transform: rotate(12deg); }
.disc-card h3 { margin: 14px 0 2px; font: 700 28px/1.05 "Barlow Condensed", sans-serif; }
.disc-card p { margin: 4px 0 0; color: #8E97AD; font-size: 14px; }
.disc-actions { display: flex; justify-content: center; align-items: center; gap: 14px; padding-top: 16px; }
.disc-actions button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #FF5A6A; background: none; color: #FF5A6A; font-size: 26px; }
.disc-actions button.like { border-color: #4DC596; color: #4DC596; font-size: 28px; }
.disc-actions button.small { width: auto; height: 40px; padding: 0 14px; border-radius: 999px; border-color: #3A4256; color: #C9CFDC; font-size: 14px; font-weight: 600; }

/* --- Films vus ce mois-ci --- */
.stats { margin-top: 26px; padding-top: 18px; border-top: 1px solid #E1E6EF; }
.stats h3 { margin: 0; font: 600 13px "Barlow", sans-serif; color: #5B6680; text-transform: uppercase; letter-spacing: .05em; }
.stat-big { font: 700 36px/1.1 "Barlow Condensed", sans-serif; margin-top: 4px; }
.stats p { margin: 6px 0; }
.stats .seenlist { font-size: 13px; }
.stats .hint { font-size: 12px; }

/* --- Ma carte --- */
.iconbtn { margin-left: auto; border: 0; background: none; color: #fff; font-size: 20px; padding: 4px 8px; line-height: 1; }
.cardbtn { border: 1.5px solid rgba(255,255,255,.4); background: none; color: #fff;
  border-radius: 999px; padding: 5px 11px; font: 600 14px "Barlow", sans-serif; white-space: nowrap;
}
dialog.card {
  width: 100%; max-width: 640px; height: 100dvh; max-height: none; margin: 0 auto; border: 0; padding: 0;
  background: #fff; color: #16203A;
}
dialog.card::backdrop { background: rgba(0,0,0,.6); }
.card-top { display: flex; align-items: center; padding: calc(env(safe-area-inset-top) + 12px) 16px 8px; }
.card-top h2 { margin: 0; flex: 1; font: 700 24px "Barlow Condensed", sans-serif; }
.card-top .x { border: 0; background: none; font-size: 22px; padding: 6px; color: inherit; }
#cardBody { padding: 8px 16px 24px; }
#cardBody img { display: block; width: 100%; max-height: 70dvh; object-fit: contain; border-radius: 12px; }
#cardBody p { color: #5B6680; font-size: 14px; margin: 10px 0; }
.card-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.card-actions button { border: 0; border-radius: 10px; padding: 11px 16px; font: 600 15px "Barlow", sans-serif; background: #1B2A4E; color: #fff; }
.card-actions button.ghost { background: #E8EDF4; color: #16203A; }
.card-num { display: flex; gap: 8px; margin-top: 14px; }
.card-num input { flex: 1; min-width: 0; border: 1.5px solid #CDD5E2; border-radius: 10px; padding: 10px 12px; font: 500 17px "Barlow", sans-serif; letter-spacing: .04em; }
.card-num button { border: 0; border-radius: 10px; padding: 0 14px; background: #F2C230; color: #1B2A4E; font: 600 14px "Barlow", sans-serif; }

[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  .cinemas, .films, .timeline { animation: in .18s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="plate">
    <h1><button class="back" id="back" aria-label="Retour à la liste des films">‹</button><span id="title">Ciné</span><button class="iconbtn" id="themeBtn" aria-label="Changer de thème (clair / sombre)">◐</button><button class="cardbtn" id="cardBtn" aria-haspopup="dialog">🎟 Ma carte</button></h1>
    <label class="search" id="searchBox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Chercher un film ou un cinéma" autocomplete="off" enterkeyhint="search" aria-label="Chercher un film ou un cinéma">
      <button class="clear" id="clear" type="button" aria-label="Effacer">✕</button>
    </label>
    <div class="days" id="days" role="group" aria-label="Jour"></div>
  </header>

  <div class="install" id="install">
    <p id="installText">Installe l'appli sur ton écran d'accueil.</p>
    <button id="installBtn">Installer</button>
    <button class="x" id="installClose" aria-label="Masquer">✕</button>
  </div>

  <div class="filters" role="group" aria-label="Filtres et tri">
    <button class="chip discover" id="discoverBtn">🎞 Découvrir</button>
    <button class="chip" id="filtersBtn" aria-haspopup="dialog">Filtres<b id="filtersCount"></b></button>
    <label class="chip"><select id="sort" aria-label="Trier les films">
      <option value="pop">↕ Plus diffusés</option><option value="note">↕ Mieux notés</option>
    </select></label>
  </div>
  <div class="activef" id="activeFilters" aria-label="Filtres actifs"></div>
  <div class="statusrow"><div class="status" id="status" aria-live="polite"></div><button class="layoutbtn" id="layoutBtn"></button></div>

  <main id="main"></main>

  <!-- Filtres : tout est visible d'un coup, résultat en direct -->
  <dialog class="sheet" id="fsheet" aria-label="Filtres">
    <div class="card-top"><h2>Filtres</h2><button class="x" id="fsheetClose" aria-label="Fermer">✕</button></div>
    <div id="fsheetBody"></div>
  </dialog>

  <!-- Actions sur une séance : double séance, partage, calendrier -->
  <dialog class="sheet" id="sheet" aria-label="Séance">
    <div class="card-top"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose" aria-label="Fermer">✕</button></div>
    <div id="sheetBody"></div>
  </dialog>

  <!-- Découverte : on fait défiler les films de la semaine -->
  <dialog class="disc" id="disc" aria-label="Découvrir les films">
    <div class="card-top"><h2>Découvrir</h2><span id="discCount"></span><button class="x" id="discClose" aria-label="Fermer">✕</button></div>
    <div id="discBody"></div>
  </dialog>

  <!-- Ma carte UGC : capture gardée uniquement sur ce téléphone (IndexedDB), jamais envoyée. -->
  <dialog class="card" id="card" aria-label="Ma carte UGC Illimité">
    <div class="card-top"><h2>Ma carte</h2><button class="x" id="cardClose" aria-label="Fermer">✕</button></div>
    <div id="cardBody"></div>
    <input type="file" id="cardFile" accept="image/*" hidden>
  </dialog>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const state = {
  // VO/VF mémorisés ; VO par défaut (cache seulement les films doublés).
  data: null, day: null, q: "", nouv: false, vo: store.get("vo", true), vf: store.get("vf", false), fav: false,
  layout: store.get("layout", "grid"), sort: store.get("sort", "pop"), showPast: false, endBy: "",
  // Films vus : {id: "AAAA-MM-JJ" | null} (null = vu avant qu'on note la date).
  seenAt: store.get("seenAt", null) ?? Object.fromEntries(store.get("seen", []).map(id => [id, null])),
  showSeen: false, envies: false,
  wish: new Set(store.get("wish", [])), nope: new Set(store.get("nope", [])),
  group: "", arr: "", view: store.get("view", "salle"), favs: new Set(store.get("favs", [])),
};

state.seen = new Set(Object.keys(state.seenAt));
function toggleSeen(id, on = !state.seen.has(id)) {
  if (on) { state.seenAt[id] = parisNow().slice(0, 10); state.seen.add(id); state.wish.delete(id); store.set("wish", [...state.wish]); }
  else { delete state.seenAt[id]; state.seen.delete(id); }
  store.set("seenAt", state.seenAt);
}
function toggleWish(id, on = !state.wish.has(id)) {
  on ? state.wish.add(id) : state.wish.delete(id);
  store.set("wish", [...state.wish]);
}

const DOW = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
const parisNow = () => {
  // Heure locale de Paris au format "AAAA-MM-JJTHH:MM", quel que soit le fuseau du téléphone.
  const p = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(new Date());
  return p.replace(" ", "T");
};

async function load() {
  $("#status").textContent = "Chargement des séances…";
  try {
    const res = await fetch("data/showtimes.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    state.data = await res.json();
  } catch {
    $("#main").innerHTML = `<div class="empty"><h2>Pas encore de séances</h2><p>Les horaires n'ont pas pu être chargés. Vérifie ta connexion, puis rouvre l'appli.</p></div>`;
    $("#status").textContent = "";
    return;
  }
  const today = parisNow().slice(0, 10);
  state.data.days = state.data.days.filter(d => d >= today);
  state.day = state.data.days[0] || today;
  // Index par film pour aller vite.
  state.byMovie = new Map();
  state.data.showtimes.forEach((s, i) => { s.i = i; });
  for (const s of state.data.showtimes) {
    if (!state.byMovie.has(s[0])) state.byMovie.set(s[0], []);
    state.byMovie.get(s[0]).push(s);
  }
  state.byTheater = new Map();
  for (const s of state.data.showtimes) {
    if (!state.byTheater.has(s[1])) state.byTheater.set(s[1], []);
    state.byTheater.get(s[1]).push(s);
  }
  state.arrs = [...new Set(Object.values(state.data.theaters).map(t => t.arr))].sort((a, b) => a - b);
  renderDays();
  syncChips();
  $("#sort").value = state.sort;
  route();
}

function renderDays() {
  $("#days").innerHTML = state.data.days.map((d, i) => {
    const dt = new Date(d + "T12:00:00");
    const label = i === 0 ? "auj." : i === 1 ? "dem." : DOW[dt.getDay()];
    return `<button class="day" data-day="${d}" aria-pressed="${d === state.day}"><b>${dt.getDate()}</b><span>${label}</span></button>`;
  }).join("");
}

// anyDay : toutes les séances à venir, quel que soit le jour choisi (pour la recherche).
function filtered(list, anyDay = false) {
  const now = parisNow();
  return list.filter(s => {
    if (anyDay ? s[2] < now : !s[2].startsWith(state.day)) return false;
    // VO = tout sauf les films doublés ; VF = tout ce qui est en français (doublé ou film français).
    if (state.vo && !state.vf && s[3] === "VF") return false;
    if (state.vf && !state.vo && s[3] === "VO") return false;
    if (!state.showPast && s[2] < now) return false;  // séances passées masquées par défaut
    const t = state.data.theaters[s[1]];
    if (!t) return false;
    if (state.group && t.group !== state.group) return false;
    if (state.arr && String(t.arr) !== state.arr) return false;
    if (state.fav && !state.favs.has(s[1])) return false;
    if (state.endBy) { const e = endMin(s); if (e && e > +state.endBy) return false; }  // durée inconnue : on garde
    return true;
  });
}

// Nouveautés : films sortis depuis 7 jours, ou pas encore sortis (avant-premières).
const today = () => parisNow().slice(0, 10);
const weekAgo = () => { const d = new Date(today() + "T12:00:00"); d.setDate(d.getDate() - 7); return d.toISOString().slice(0, 10); };
const isNew = m => !!m.release && m.release >= weekAgo();
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", d.slice(0, 4) === today().slice(0, 4)
  ? { weekday: "short", day: "numeric", month: "short" } : { day: "numeric", month: "short", year: "numeric" });
const badge = m => !isNew(m) ? "" : m.release > today()
  ? `<span class="badge">Sortie ${esc(fmtDay(m.release))}</span>` : `<span class="badge">Nouveau</span>`;

// Fin estimée : début + durée du film + ~15 min de pubs et bandes-annonces.
const ADS_MIN = 15;
const runtimeMin = m => { const r = /(?:(\d+)h)?\s*(\d+)?\s*min/.exec(m?.runtime || ""); return r ? (+r[1] || 0) * 60 + (+r[2] || 0) : 0; };
// Fin en minutes depuis minuit le jour de la séance (peut dépasser 1440 après minuit).
const endMin = s => {
  const d = runtimeMin(state.data.movies[s[0]]); if (!d) return null;
  const [h, mi] = s[2].slice(11).split(":").map(Number);
  return h * 60 + mi + d + ADS_MIN;
};
const endTime = s => {
  const t = endMin(s); if (t == null) return "";
  return `${String(Math.floor(t / 60) % 24).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
};

// Itinéraire Google Maps vers la salle (depuis la position du téléphone).
// Fiche Letterboxd (recherche par titre original : Letterboxd n'a pas d'API publique pour les notes).
// Letterboxd : ouvre l'appli si elle est installée, sur une recherche du titre original.
// - Android : lien « intent » vers l'appli (com.letterboxd.letterboxd), repli sur le site sinon.
// - iPhone : lien universel letterboxd.com/search/<titre>/ (non exclu de l'appli par Letterboxd),
//   ouvert sans nouvel onglet pour qu'iOS passe la main à l'appli.
// Petites icônes (copier / copié).
const COPY_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const CHECK_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`;
const IS_ANDROID = /android/i.test(navigator.userAgent);
const letterboxdUrl = m => {
  const web = "https://letterboxd.com/search/" + encodeURIComponent(m.original || m.title) + "/";
  return IS_ANDROID
    ? `intent://${web.slice(8)}#Intent;scheme=https;package=com.letterboxd.letterboxd;S.browser_fallback_url=${encodeURIComponent(web)};end`
    : web;
};
const mapsUrl = t => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(`${t.name}, ${t.address}, ${t.zip} Paris`);
const rating = m => m.rating ? ` · ★ ${String(m.rating).replace(".", ",")}` : "";
const arrBadge = (t, cls = "arr") => `<span class="${cls} ${t.group === "Indépendant" ? "" : t.group}">${t.arr}</span>`;

// « FR » (film français) n'est pas affiché : la version va de soi.
const label = s => [s[3] === "FR" ? "" : s[3], ...s[4]].filter(Boolean).join(" ");

const posterHTML = (m, cls = "poster") => m.poster
  ? `<div class="${cls}" style="background-image:url('${esc(m.poster)}')" role="img" aria-label="Affiche"></div>`
  : `<div class="${cls}" aria-hidden="true">${esc((m.title || "?")[0])}</div>`;

function renderList() {
  $("#app").classList.remove("film-mode");
  $("#title").textContent = "Ciné";
  const q = norm(state.q).trim();
  const now = parisNow();
  const rows = [];
  let hiddenSeen = 0;
  for (const [id, list] of state.byMovie) {
    const m = state.data.movies[id];
    if (!m) continue;
    if (q && !norm(m.title).includes(q) && !norm(m.original).includes(q)) continue;
    if (state.nouv && !isNew(m)) continue;
    if (state.envies && !state.wish.has(id)) continue;
    // Films déjà vus masqués (sauf si on les cherche ou qu'on demande à les voir).
    if (state.seen.has(id) && !q && !state.showSeen) { if (filtered(list).length) hiddenSeen++; continue; }
    const shows = filtered(list);
    if (!shows.length) {
      // Recherche : le film ne passe pas ce jour-là, on indique sa prochaine séance.
      const later = q && filtered(list, true)[0];
      if (later) rows.push({ id, m, n: 0, theaters: 0, later });
      continue;
    }
    const upcoming = shows.filter(s => s[2] >= now);
    const theaters = new Set(shows.map(s => s[1]));
    rows.push({ id, m, n: shows.length, theaters: theaters.size, next: upcoming[0]?.[2] });
  }
  // Nouveautés : films déjà sortis (le plus récent d'abord), puis à venir (le plus proche d'abord).
  const t0 = today();
  const byRelease = (a, b) => {
    const fa = a.m.release > t0, fb = b.m.release > t0;
    return fa !== fb ? fa - fb : fa ? a.m.release.localeCompare(b.m.release) : b.m.release.localeCompare(a.m.release);
  };
  // « Mieux notés » : d'abord les films récents (sortis en salle depuis 3 mois, ou à venir),
  // puis ceux sortis avant (reprises comprises) ; dans chaque groupe, par note des spectateurs
  // AlloCiné (les films sans note ou avec moins de 20 avis passent après).
  const score = m => m.rating && (m.votes == null || m.votes >= 20) ? m.rating : 0;
  const recentSince = (() => { const d = new Date(t0 + "T12:00:00"); d.setMonth(d.getMonth() - 3); return d.toISOString().slice(0, 10); })();
  const isRecent = m => !!m.release && m.release >= recentSince;
  const byNote = state.sort === "note";
  rows.sort((a, b) => (!a.n - !b.n) || (byNote && (isRecent(b.m) - isRecent(a.m) || score(b.m) - score(a.m)))
    || (state.nouv && byRelease(a, b)) || b.theaters - a.theaters || b.n - a.n);
  // Recherche : salles dont le nom correspond (« danton », « mk2 », « champo »…).
  const cineHits = q ? Object.entries(state.data.theaters).filter(([, t]) => norm(t.name).includes(q))
    .sort(([a, x], [b, y]) => (state.favs.has(b) - state.favs.has(a)) || x.arr - y.arr) : [];
  const cineHTML = cineHits.length ? `<h3 class="list-sep">Cinémas</h3><ul class="cinehits">${cineHits.map(([tid, t]) => {
      const n = filtered(state.byTheater.get(tid) || []).length;
      return `<li><a href="#/salle/${esc(tid)}">${arrBadge(t)}<span><b>${state.favs.has(tid) ? "★ " : ""}${esc(t.name)}</b><small>${n} séance${n > 1 ? "s" : ""} ce jour-là</small></span><i aria-hidden="true">›</i></a></li>`;
    }).join("")}</ul>${rows.length ? `<h3 class="list-sep">Films</h3>` : ""}` : "";
  setStatus(rows.length ? `${rows.length} film${rows.length > 1 ? "s" : ""}` : cineHits.length ? `${cineHits.length} cinéma${cineHits.length > 1 ? "s" : ""}` : "");
  const seenLink = hiddenSeen ? `<button class="pastlink" data-seen-list="1">Afficher ${hiddenSeen} film${hiddenSeen > 1 ? "s" : ""} déjà vu${hiddenSeen > 1 ? "s" : ""}</button>`
    : state.showSeen && state.seen.size ? `<button class="pastlink" data-seen-list="0">Masquer les films déjà vus</button>` : "";
  if (!rows.length && cineHits.length) { $("#main").innerHTML = cineHTML; return; }
  if (!rows.length) {
    $("#main").innerHTML = emptyHTML("Aucun film trouvé", q ? "Aucune séance à venir avec ces filtres." : "Change de jour ou enlève des filtres.") + seenLink;
    return;
  }
  const rowHTML = r => {
    const seen = state.seen.has(r.id) ? `<span class="badge seen">Déjà vu</span>` : "";
    const heart = state.wish.has(r.id) ? `<span class="wishmark" aria-label="Envie de voir">♥</span>` : "";
    const info = r.n ? `${r.theaters} salle${r.theaters > 1 ? "s" : ""} · ${r.n} séance${r.n > 1 ? "s" : ""}` : "Pas de séance ce jour-là";
    const next = r.later ? `<b>${esc(fmtDay(r.later[2].slice(0, 10)))}</b><small>${r.later[2].slice(11)}</small>`
      : r.next ? `<b>${r.next.slice(11)}</b><small>prochaine</small>` : `<small>terminé</small>`;
    return `
    <li><button class="film-row${state.seen.has(r.id) ? " is-seen" : ""}" data-film="${r.id}"${r.later ? ` data-goday="${r.later[2].slice(0, 10)}"` : ""}>
      <div class="pwrap">${posterHTML(r.m)}${heart}${r.m.rating ? `<span class="rate">★ ${String(r.m.rating).replace(".", ",")}</span>` : ""}</div>
      <div>${badge(r.m)}${seen}<h2>${esc(r.m.title)}</h2><p>${info}${r.m.runtime ? " · " + esc(r.m.runtime) : ""}${rating(r.m)}</p></div>
      <div class="next">${next}</div>
    </button></li>`;
  };
  const list = rs => `<ul class="films${state.layout === "grid" ? " grid" : ""}">${rs.map(rowHTML).join("")}</ul>`;
  const recent = rows.filter(r => isRecent(r.m)), older = rows.filter(r => !isRecent(r.m));
  $("#main").innerHTML = cineHTML + (byNote && recent.length && older.length
    ? `<h3 class="list-sep">Sorties récentes</h3>${list(recent)}<h3 class="list-sep">Sortis il y a plus de 3 mois</h3>${list(older)}${seenLink}`
    : list(rows) + seenLink);
}

function emptyHTML(title, hint) {
  return `<div class="empty"><h2>${esc(title)}</h2><p>${esc(hint)}</p></div>`;
}

// Horaires cliquables (réservation), la prochaine séance en jaune.
function timeChips(list, t, now) {
  let soonDone = false;
  return list.map(s => {
    const past = s[2] < now;
    let cls = past ? "past" : "";
    if (!past && !soonDone) { cls = "soon"; soonDone = true; }
    if (s[3] === "VF") cls += " vf";
    const end = endTime(s);
    const inner = `${s[2].slice(11)}<small>${esc(label(s))}</small>${end && !past ? `<i class="end">→ ${end}</i>` : ""}`;
    const url = !past && (s[5] || t.allocine);
    return url ? `<a class="time ${cls}" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Réserver la séance de ${s[2].slice(11)}">${inner}</a>`
               : `<span class="time ${cls}">${inner}</span>`;
  }).join("");
}

// --- Page d'un cinéma : tous ses films du jour ---
function renderCinema(tid) {
  const t = state.data.theaters[tid];
  if (!t) { location.hash = ""; return; }
  $("#app").classList.add("film-mode");
  $("#title").textContent = "Ciné";
  const now = parisNow();
  const list = filtered(state.byTheater.get(tid) || []);
  const byM = new Map();
  for (const s of list) { if (!byM.has(s[0])) byM.set(s[0], []); byM.get(s[0]).push(s); }
  const films = [...byM.entries()].map(([id, shows]) => ({ id, m: state.data.movies[id], shows, next: shows.find(s => s[2] >= now)?.[2] || "~" }))
    .filter(f => f.m && !(state.seen.has(f.id) && !state.showSeen))
    .sort((a, b) => (state.wish.has(b.id) - state.wish.has(a.id)) || a.next.localeCompare(b.next));
  const fav = state.favs.has(tid);
  const pastN = state.day === today() && !state.showPast
    ? (state.byTheater.get(tid) || []).filter(s => s[2].startsWith(state.day) && s[2] < now).length : 0;
  const pastLink = state.showPast && state.day === today() ? `<button class="pastlink" data-past="0">Masquer les séances passées</button>`
    : pastN ? `<button class="pastlink" data-past="1">Voir les ${pastN} séance${pastN > 1 ? "s" : ""} déjà passée${pastN > 1 ? "s" : ""}</button>` : "";
  setStatus(list.length ? `${films.length} film${films.length > 1 ? "s" : ""} · ${list.length} séance${list.length > 1 ? "s" : ""}` : "");
  $("#main").innerHTML = `
    <div class="cine-head">${arrBadge(t, "arr big")}
      <div class="cine-name"><h2>${esc(t.name)}</h2><p>${esc(t.address)}, ${esc(t.zip)} Paris</p>
        <div class="film-actions"><a class="ext" href="${esc(mapsUrl(t))}" target="_blank" rel="noopener">Itinéraire ↗</a>${t.allocine ? `<a class="ext" href="${esc(t.allocine)}" target="_blank" rel="noopener">AlloCiné ↗</a>` : ""}</div></div>
      <button class="star" data-star="${esc(tid)}" aria-pressed="${fav}" aria-label="${fav ? "Retirer de mes salles" : "Ajouter à mes salles"}">${fav ? "★" : "☆"}</button></div>
    ${pastLink}
    ${films.length ? `<ul class="cinemas">${films.map(f => `<li class="cine cine-film">
        <button class="cf-head" data-film="${f.id}">${posterHTML(f.m)}<div><h3>${state.wish.has(f.id) ? "♥ " : ""}${esc(f.m.title)}</h3>
          <p>${esc([f.m.runtime, f.m.rating && "★ " + String(f.m.rating).replace(".", ","), f.m.genres?.[0]].filter(Boolean).join(" · "))}</p></div><b aria-hidden="true">›</b></button>
        <div class="times">${timeChips(f.shows, t, now)}</div></li>`).join("")}</ul>`
      : emptyHTML(pastN ? "Plus de séance aujourd'hui" : "Pas de séance ce jour-là", "Essaie un autre jour ou enlève des filtres.")}`;
}

function renderFilm(id) {
  const m = state.data.movies[id];
  if (!m) { location.hash = ""; return; }
  $("#app").classList.add("film-mode");
  $("#title").textContent = "Ciné";
  const now = parisNow();
  const shows = filtered(state.byMovie.get(id) || []);
  // Lien pour réafficher les séances passées (aujourd'hui seulement).
  const pastN = state.day === today() && !state.showPast
    ? (({ showPast }) => { state.showPast = true; const n = filtered(state.byMovie.get(id) || []).filter(s => s[2] < now).length; state.showPast = showPast; return n; })(state) : 0;
  const pastLink = state.showPast && state.day === today()
    ? `<button class="pastlink" data-past="0">Masquer les séances passées</button>`
    : pastN ? `<button class="pastlink" data-past="1">Voir les ${pastN} séance${pastN > 1 ? "s" : ""} déjà passée${pastN > 1 ? "s" : ""}</button>` : "";
  const meta = [m.release && (m.release > today() ? "sortie le " : "sorti le ") + fmtDay(m.release), m.runtime, m.rating && "★ " + String(m.rating).replace(".", ",") + "/5 AlloCiné", m.genres?.slice(0, 2).join(", "), m.directors?.length ? "de " + m.directors.join(", ") : ""].filter(Boolean).join(" · ");
  const orig = m.original && norm(m.original) !== norm(m.title) ? `<p>${esc(m.original)}</p>` : "";
  let body;
  if (!shows.length) {
    body = emptyHTML(pastN ? "Plus de séance aujourd'hui" : "Pas de séance ce jour-là", "Essaie un autre jour ou enlève des filtres.");
  } else if (state.view === "heure") {
    body = `<ul class="timeline">${shows.map(s => {
      const t = state.data.theaters[s[1]];
      // Toute la ligne ouvre la réservation de cette séance sur le site du cinéma.
      const url = s[2] >= now && (s[5] || t.allocine);
      const row = url ? `a class="row" href="${esc(url)}" target="_blank" rel="noopener"` : `div class="row"`;
      const end = endTime(s), fav = state.favs.has(s[1]) ? "★ " : "";
      const more = s[2] >= now ? `<button class="more" data-more="${s.i}" aria-label="Enchaîner un 2e film, partager, calendrier">⋯</button>` : "";
      return `<li class="tl"><${row}><div class="when ${s[2] < now ? "past" : ""}">${s[2].slice(11)}${end ? `<small>→ ${end}</small>` : ""}</div>
        <div class="where">${arrBadge(t)}<span>${fav}${esc(t.name)}</span><small>${esc(label(s))}</small>${url ? `<b class="go" aria-hidden="true">›</b>` : ""}</div></${row.split(" ")[0]}>${more}</li>`;
    }).join("")}</ul>`;
  } else {
    const byT = new Map();
    for (const s of shows) { if (!byT.has(s[1])) byT.set(s[1], []); byT.get(s[1]).push(s); }
    const groups = [...byT.entries()].map(([tid, list]) => ({ tid, t: state.data.theaters[tid], list, next: list.find(s => s[2] >= now)?.[2] || "~" }));
    // Mes salles d'abord, puis la prochaine séance.
    groups.sort((a, b) => (state.favs.has(b.tid) - state.favs.has(a.tid)) || a.next.localeCompare(b.next) || a.t.arr - b.t.arr);
    body = `<ul class="cinemas">${groups.map(g => {
      const times = timeChips(g.list, g.t, now);
      const fav = state.favs.has(g.tid);
      return `<li class="cine">
        <div class="cine-top">${arrBadge(g.t)}
          <div class="cine-name"><h3><a class="cinelink" href="#/salle/${esc(g.tid)}">${esc(g.t.name)} ›</a></h3>${g.t.allocine ? `<a href="${esc(g.t.allocine)}" target="_blank" rel="noopener">${esc(g.t.address)} · la salle</a>` : `<span>${esc(g.t.address)}</span>`}<small class="dist"><a href="${esc(mapsUrl(g.t))}" target="_blank" rel="noopener">Itinéraire ↗</a></small></div>
          <button class="star" data-star="${esc(g.tid)}" aria-pressed="${fav}" aria-label="${fav ? "Retirer de mes salles" : "Ajouter à mes salles"}">${fav ? "★" : "☆"}</button></div>
        <div class="times">${times}</div></li>`;
    }).join("")}</ul>`;
  }
  const nT = new Set(shows.map(s => s[1])).size;
  setStatus(shows.length ? `${shows.length} séance${shows.length > 1 ? "s" : ""} dans ${nT} salle${nT > 1 ? "s" : ""}` : "");
  $("#main").innerHTML = `
    <div class="film-head${m.poster ? " hero" : ""}"${m.poster ? ` style="--bg:url('${esc(m.poster)}')"` : ""}>${posterHTML(m)}<div><h2>${esc(m.title)}<button class="copyicon" data-copy="${esc(m.original || m.title)}" aria-label="Copier le titre « ${esc(m.original || m.title)} »">${COPY_SVG}</button></h2>${orig}<p>${esc(meta)}</p><div class="film-actions"><a class="ext" href="${esc(letterboxdUrl(m))}" rel="noopener">Voir sur Letterboxd ↗</a>
      <button class="seenbtn" data-wish-film="${esc(id)}" aria-pressed="${state.wish.has(id)}">${state.wish.has(id) ? "♥ Envie de voir" : "♡ Envie de voir"}</button>
      <button class="seenbtn" data-seen-film="${esc(id)}" aria-pressed="${state.seen.has(id)}">${state.seen.has(id) ? "✓ Déjà vu" : "Marquer déjà vu"}</button></div></div></div>
    <div class="view-toggle" role="group" aria-label="Affichage">
      <button data-view="salle" aria-pressed="${state.view === "salle"}">Par salle</button>
      <button data-view="heure" aria-pressed="${state.view === "heure"}">Par heure</button>
    </div>
    <div class="legend"><span><i style="background:var(--ugc)"></i>UGC</span><span><i style="background:var(--mk2)"></i>MK2</span><span><i style="background:var(--indep)"></i>Indé</span><span>n° = arrondissement</span><span>→ fin estimée, pubs comprises</span>${state.view === "heure" ? `<span>⋯ = enchaîner un 2e film, partager, calendrier</span>` : `<button class="hint" data-view="heure">🎬 Enchaîner un 2e film, partager : vue « Par heure » ›</button>`}</div>
    ${pastLink}${body}`;
}

function setStatus(extra) {
  const d = state.data;
  const upd = d.generatedAt ? new Date(d.generatedAt) : null;
  const when = upd ? upd.toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" }) : "";
  $("#status").textContent = [extra, when && `mis à jour ${when}`].filter(Boolean).join(" — ");
}

function route() {
  if (!state.data) return;
  const m = location.hash.match(/^#\/film\/(\w+)/), c = location.hash.match(/^#\/salle\/(\w+)/);
  m ? renderFilm(m[1]) : c ? renderCinema(c[1]) : renderList();
}

$("#back").onclick = () => history.length > 1 ? history.back() : (location.hash = "");
$("#q").addEventListener("input", e => {

});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("#clear").onclick = () => { $("#q").value = ""; state.q = ""; $("#searchBox").classList.remove("has-text"); route(); $("#q").focus(); };
$("#days").onclick = e => {

// --- Filtres ---
// Chaque filtre : [clé, valeur, libellé]. Les booléens se cochent, les autres se choisissent (re-toucher = retirer).
const ENDS = [["1320", "22 h"], ["1380", "23 h"], ["1440", "minuit"]];
const arrLabel = a => a === 1 ? "1er" : a + "e";
const FILTER_SECTIONS = () => [
  ["Version", [["vo", true, "VO (sans les doublés)"], ["vf", true, "VF (en français)"]]],
  ["Sélection", [["nouv", true, "✦ Nouveautés"], ["envies", true, "♥ Mes envies"], ["fav", true, "★ Mes salles"]]],
  ["Fin de la séance avant", ENDS.map(([v, l]) => ["endBy", v, l])],
  ["Enseigne", [["group", "UGC", "UGC"], ["group", "MK2", "MK2"], ["group", "Indépendant", "Indépendants"]]],
  ["Arrondissement", (state.arrs || []).map(a => ["arr", String(a), arrLabel(a)])],
];
const isOn = (k, v) => v === true ? !!state[k] : state[k] === v;
function activeFilters() {
  const out = [];
  for (const [, items] of FILTER_SECTIONS())
    for (const [k, v, l] of items) if (isOn(k, v)) out.push([k, k === "endBy" ? `Fin avant ${l}` : k === "arr" ? `${l} arr.` : l.replace(/ \(.*\)/, "")]);
  return out;
}
function setFilter(k, v) {
  state[k] = v === true ? !state[k] : (state[k] === v ? "" : v);
  if (k === "vo" || k === "vf") store.set(k, state[k]);
  syncChips(); route();
}
// Nombre de films visibles avec les filtres actuels (pour « Voir les N films »).
function visibleCount() {
  let n = 0;
  for (const [id, list] of state.byMovie) {
    const m = state.data.movies[id];
    if (!m || (state.nouv && !isNew(m)) || (state.envies && !state.wish.has(id)) || (state.seen.has(id) && !state.showSeen)) continue;
    if (filtered(list).length) n++;
  }
  return n;
}
function renderFilterSheet() {
  const n = visibleCount();
  $("#fsheetBody").innerHTML = FILTER_SECTIONS().map(([title, items]) => `
    <h3 class="list-sep">${esc(title)}</h3>
    <div class="fopts${title === "Arrondissement" ? " arrs" : ""}">${items.map(([k, v, l]) =>
      `<button class="fopt" data-set="${k}" data-val="${v === true ? "1" : esc(v)}" aria-pressed="${isOn(k, v)}">${esc(l)}</button>`).join("")}</div>`).join("") + `
    <div class="fsheet-foot">
      <button class="ghost" data-reset="1">Réinitialiser</button>
      <button class="primary" id="fsheetApply">Voir ${n} film${n > 1 ? "s" : ""}</button>
    </div>`;
}
function syncChips() {
  const act = activeFilters();
  $("#filtersCount").textContent = act.length || "";
  $("#filtersBtn").setAttribute("aria-pressed", act.length > 0);
  $("#activeFilters").innerHTML = act.map(([k, l]) => `<button class="pill" data-clear="${k}" aria-label="Retirer le filtre ${esc(l)}">${esc(l)} ✕</button>`).join("");
  if ($("#fsheet").open) renderFilterSheet();
}
$("#filtersBtn").onclick = () => { renderFilterSheet(); $("#fsheet").showModal(); };
$("#fsheetClose").onclick = () => $("#fsheet").close();
$("#fsheet").addEventListener("click", e => {
  if (e.target === $("#fsheet") || e.target.id === "fsheetApply") return $("#fsheet").close();
  const b = e.target.closest("[data-set]");
  if (b) return setFilter(b.dataset.set, b.dataset.val === "1" && ["vo", "vf", "nouv", "envies", "fav"].includes(b.dataset.set) ? true : b.dataset.val);
  if (e.target.closest("[data-reset]")) {
    Object.assign(state, { vo: false, vf: false, nouv: false, envies: false, fav: false, endBy: "", group: "", arr: "" });
    store.set("vo", false); store.set("vf", false); syncChips(); route();
  }
});
$("#activeFilters").onclick = e => {
  const b = e.target.closest("[data-clear]"); if (!b) return;
  const k = b.dataset.clear;
  state[k] = typeof state[k] === "boolean" ? false : "";
  if (k === "vo" || k === "vf") store.set(k, false);
  syncChips(); route();
};
const syncLayout = () => {
  $("#layoutBtn").textContent = state.layout === "grid" ? "☰ Liste" : "▦ Affiches";
  $("#layoutBtn").setAttribute("aria-label", state.layout === "grid" ? "Afficher en liste" : "Afficher les affiches");
};
$("#layoutBtn").onclick = () => { state.layout = state.layout === "grid" ? "list" : "grid"; store.set("layout", state.layout); syncLayout(); route(); };
$("#themeBtn").onclick = () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t; store.set("theme", t);
};
syncLayout();
$("#sort").onchange = e => { state.sort = e.target.value; store.set("sort", state.sort); route(); };
$("#main").addEventListener("click", e => {
  const film = e.target.closest("[data-film]");
  if (film) {
    if (film.dataset.goday) { state.day = film.dataset.goday; renderDays(); }  // recherche : jour de la prochaine séance
    location.hash = `#/film/${film.dataset.film}`; return;
  }
  const more = e.target.closest("[data-more]");
  if (more) { openSheet(state.data.showtimes[more.dataset.more]); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) {  // à coller dans la recherche de l'appli Letterboxd
    navigator.clipboard?.writeText(copy.dataset.copy).then(() => {
      copy.innerHTML = CHECK_SVG; copy.setAttribute("aria-label", "Titre copié");
      setTimeout(() => { copy.innerHTML = COPY_SVG; }, 1500);
    }, () => {});
    return;
  }
  const wishFilm = e.target.closest("[data-wish-film]");
  if (wishFilm) { toggleWish(wishFilm.dataset.wishFilm); route(); return; }
  const seenFilm = e.target.closest("[data-seen-film]");
  if (seenFilm) {
    const id = seenFilm.dataset.seenFilm;
    toggleSeen(id); route(); return;
  }
  const seenList = e.target.closest("[data-seen-list]");
  if (seenList) { state.showSeen = seenList.dataset.seenList === "1"; route(); return; }
  const past = e.target.closest("[data-past]");
  if (past) { state.showPast = past.dataset.past === "1"; route(); return; }
  const v = e.target.closest("[data-view]");
  if (v) { state.view = v.dataset.view; store.set("view", state.view); route(); return; }
  const star = e.target.closest("[data-star]");
  if (star) {
    const id = star.dataset.star;
    state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
    store.set("favs", [...state.favs]); route();
  }
});
// Rafraîchit les séances passées toutes les minutes.
setInterval(() => { if (state.data && document.visibilityState === "visible") route(); }, 60000);

// --- Actions sur une séance ---
const showDate = s => `${fmtDay(s[2].slice(0, 10))} à ${s[2].slice(11).replace(":", "h")}`;
const bookUrl = s => s[5] || state.data.theaters[s[1]].allocine || location.href;

// Double séance : films qui commencent après la fin (≤ 75 min d'attente), même salle puis même
// arrondissement ; les films déjà vus et les filtres actifs (VO…) sont respectés.
function doubleFeature(s) {
  const end = endMin(s); if (end == null) return [];
  const t = state.data.theaters[s[1]], day = s[2].slice(0, 10);
  const minOf = x => +x[2].slice(11, 13) * 60 + +x[2].slice(14, 16);
  const seenFilm = new Set();
  return filtered(state.data.showtimes.filter(x => x[2].startsWith(day)), true)
    .filter(x => x[0] !== s[0] && !state.seen.has(x[0]))
    .map(x => ({ x, wait: minOf(x) - end, same: x[1] === s[1], near: state.data.theaters[x[1]]?.arr === t.arr }))
    .filter(c => c.wait >= -5 && c.wait <= 75 && (c.same || c.near))
    .sort((a, b) => (b.same - a.same) || a.wait - b.wait)
    .filter(c => !seenFilm.has(c.x[0] + c.x[1]) && seenFilm.add(c.x[0] + c.x[1]))  // 1 séance par film et par salle
    .slice(0, 8);
}

function icsFor(s) {
  const m = state.data.movies[s[0]], t = state.data.theaters[s[1]];
  const d = s[2].replace(/[-:]/g, ""), e = endMin(s) ?? (+s[2].slice(11, 13) * 60 + +s[2].slice(14, 16) + 120);
  const endDay = new Date(s[2].slice(0, 10) + "T12:00:00"); endDay.setDate(endDay.getDate() + Math.floor(e / 1440));
  const dEnd = endDay.toISOString().slice(0, 10).replace(/-/g, "") + "T" + String(Math.floor(e % 1440 / 60)).padStart(2, "0") + String(e % 60).padStart(2, "0") + "00";
  const txt = v => String(v).replace(/[\\,;]/g, c => "\\" + c).replace(/\n/g, "\\n");
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Cine//FR", "BEGIN:VEVENT",
    `UID:${d}-${s[1]}-${s[0]}@cine`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`,
    `DTSTART:${d}00`, `DTEND:${dEnd}`, `SUMMARY:${txt("🎬 " + m.title)}`, `LOCATION:${txt(`${t.name}, ${t.address}, ${t.zip} Paris`)}`,
    `DESCRIPTION:${txt([label(s), "Réserver : " + bookUrl(s)].filter(Boolean).join("\n"))}`, `URL:${bookUrl(s)}`,
    "BEGIN:VALARM", "TRIGGER:-PT45M", "ACTION:DISPLAY", `DESCRIPTION:${txt(m.title)}`, "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
}

function openSheet(s) {
  const m = state.data.movies[s[0]], t = state.data.theaters[s[1]], end = endTime(s);
  $("#sheetTitle").textContent = m.title;
  const pairs = doubleFeature(s);
  const pairHTML = pairs.length ? `<ul class="pairs">${pairs.map(({ x, wait, same }) => {
      const pm = state.data.movies[x[0]], pt = state.data.theaters[x[1]], pe = endTime(x);
      return `<li><a href="${esc(bookUrl(x))}" target="_blank" rel="noopener">${posterHTML(pm)}
        <div><b>${esc(pm.title)}</b><span>${x[2].slice(11)}${pe ? ` → ${pe}` : ""} · ${same ? "même salle" : esc(pt.name)}</span>
        <small>${wait <= 0 ? "juste après" : `${wait} min d'attente`}${pm.rating ? ` · ★ ${String(pm.rating).replace(".", ",")}` : ""}${label(x) ? " · " + esc(label(x)) : ""}</small></div></a></li>`;
    }).join("")}</ul>`
    : `<p class="muted">Aucun autre film ne commence juste après dans cette salle ou ce quartier${state.vo || state.endBy || state.group ? " (avec tes filtres)" : ""}.</p>`;
  $("#sheetBody").innerHTML = `
    <p class="sheet-sub">${esc(t.name)} · ${esc(showDate(s))}${end ? ` → ${end}` : ""}${label(s) ? " · " + esc(label(s)) : ""}</p>
    <div class="card-actions">
      <a class="btn" href="${esc(bookUrl(s))}" target="_blank" rel="noopener">Réserver</a>
      <button class="ghost" data-share="${s.i}">Partager</button>
      <button class="ghost" data-ics="${s.i}">Ajouter au calendrier</button>
    </div>
    <h3 class="list-sep">🎬 Enchaîner un 2e film</h3>${pairHTML}`;
  $("#sheet").showModal();
}
$("#sheetClose").onclick = () => $("#sheet").close();
$("#sheet").addEventListener("click", async e => {
  if (e.target === $("#sheet")) return $("#sheet").close();  // clic à côté
  const sh = e.target.closest("[data-share]"), ic = e.target.closest("[data-ics]");
  if (sh) {
    const s = state.data.showtimes[sh.dataset.share], m = state.data.movies[s[0]], t = state.data.theaters[s[1]];
    const text = `${m.title} — ${t.name}, ${showDate(s)}${label(s) ? " (" + label(s) + ")" : ""}`;
    try {
      if (navigator.share) await navigator.share({ title: m.title, text, url: bookUrl(s) });
      else { await navigator.clipboard.writeText(`${text}\n${bookUrl(s)}`); sh.textContent = "Copié ✓"; }
    } catch {}
  }
  if (ic) {
    const s = state.data.showtimes[ic.dataset.ics];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([icsFor(s)], { type: "text/calendar;charset=utf-8" }));
    a.download = `seance-${state.data.movies[s[0]].title.replace(/[^\w]+/g, "-").toLowerCase()}.ics`;
    document.body.append(a); a.click(); a.remove();
  }
});

// --- Découverte : glisser à droite = envie, à gauche = pas pour moi ---
let deck = [], deckPos = 0, deckLiked = 0;
function buildDeck() {
  const rows = [];
  for (const [id, list] of state.byMovie) {
    const m = state.data.movies[id];
    if (!m || state.seen.has(id) || state.wish.has(id) || state.nope.has(id)) continue;
    const shows = filtered(list, true);
    if (shows.length) rows.push({ id, m, n: shows.length, th: new Set(shows.map(s => s[1])).size, next: shows[0] });
  }
  return rows.sort((a, b) => (isNew(b.m) - isNew(a.m)) || b.th - a.th || b.n - a.n);
}
function renderDisc() {
  const r = deck[deckPos];
  $("#discCount").textContent = r ? `${deckPos + 1} / ${deck.length}` : "";
  if (!r) {
    $("#discBody").innerHTML = `<div class="empty"><h2>C'est tout pour cette semaine 🎬</h2>
      <p>${deckLiked ? `${deckLiked} film${deckLiked > 1 ? "s" : ""} ajouté${deckLiked > 1 ? "s" : ""} à tes envies.` : "Aucun nouveau film à découvrir."}</p>
      <div class="card-actions" style="justify-content:center"><button data-disc="envies">♥ Voir mes envies</button>
      ${state.nope.size ? `<button class="ghost" data-disc="reset">Revoir les films écartés</button>` : ""}</div></div>`;
    return;
  }
  const m = r.m, meta = [m.genres?.slice(0, 2).join(", "), m.runtime, m.directors?.length && "de " + m.directors[0]].filter(Boolean).join(" · ");
  $("#discBody").innerHTML = `
    <div class="disc-card" id="discCard">
      <div class="disc-poster"${m.poster ? ` style="background-image:url('${esc(m.poster)}')"` : ""}>${m.poster ? "" : esc(m.title[0])}
        ${badge(m)}${m.rating ? `<span class="rate">★ ${String(m.rating).replace(".", ",")}</span>` : ""}
        <span class="stamp like">ENVIE</span><span class="stamp nope">BOF</span></div>
      <h3>${esc(m.title)}</h3><p>${esc(meta)}</p>
      <p>${r.th} salle${r.th > 1 ? "s" : ""} · prochaine séance ${esc(fmtDay(r.next[2].slice(0, 10)))} à ${r.next[2].slice(11)}</p>
    </div>
    <div class="disc-actions">
      <button data-disc="nope" aria-label="Pas pour moi">✕</button>
      <button data-disc="seen" class="small" aria-label="Déjà vu">✓ vu</button>
      <button data-disc="info" class="small" aria-label="Voir les séances">séances</button>
      <button data-disc="like" class="like" aria-label="Envie de voir">♥</button>
    </div>`;
  swipeable($("#discCard"));
}
function decide(kind) {
  const r = deck[deckPos]; if (!r) return;
  if (kind === "like") { toggleWish(r.id, true); deckLiked++; }
  if (kind === "nope") { state.nope.add(r.id); store.set("nope", [...state.nope]); }
  if (kind === "seen") toggleSeen(r.id, true);
  const card = $("#discCard");
  if (card) { card.style.transition = "transform .25s ease, opacity .25s"; card.style.transform = `translateX(${kind === "nope" ? -120 : 120}%) rotate(${kind === "nope" ? -12 : 12}deg)`; card.style.opacity = 0; }
  setTimeout(() => { deckPos++; renderDisc(); }, 220);
}
function swipeable(card) {
  let x0 = null, dx = 0;
  card.addEventListener("pointerdown", e => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = "none"; });
  card.addEventListener("pointermove", e => {
    if (x0 == null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    card.style.setProperty("--like", Math.max(0, Math.min(1, dx / 90)));
    card.style.setProperty("--nope", Math.max(0, Math.min(1, -dx / 90)));
  });
  const end = () => {
    if (x0 == null) return; x0 = null;
    if (Math.abs(dx) > 90) return decide(dx > 0 ? "like" : "nope");
    card.style.transition = "transform .2s"; card.style.transform = ""; card.style.setProperty("--like", 0); card.style.setProperty("--nope", 0);
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}
$("#discoverBtn").onclick = () => { deck = buildDeck(); deckPos = 0; deckLiked = 0; renderDisc(); $("#disc").showModal(); };
$("#discClose").onclick = () => { $("#disc").close(); route(); };
$("#discBody").addEventListener("click", e => {
  const b = e.target.closest("[data-disc]"); if (!b) return;
  const k = b.dataset.disc;
  if (k === "info") { const r = deck[deckPos]; $("#disc").close(); location.hash = `#/film/${r.id}`; return; }
  if (k === "envies") { state.envies = true; syncChips(); $("#disc").close(); location.hash ? (location.hash = "") : route(); return; }
  if (k === "reset") { state.nope.clear(); store.set("nope", []); deck = buildDeck(); deckPos = 0; renderDisc(); return; }
  decide(k);
});

// --- Ma carte UGC (stockée uniquement sur l'appareil, dans IndexedDB) ---
const cardDB = {
  open: () => new Promise((ok, ko) => {
    const r = indexedDB.open("ma-carte", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  }),
  async op(mode, fn) {
    const db = await this.open();
    return new Promise((ok, ko) => {
      const tx = db.transaction("kv", mode), req = fn(tx.objectStore("kv"));
      tx.oncomplete = () => ok(req.result); tx.onerror = () => ko(tx.error);
    });
  },
  get: k => cardDB.op("readonly", st => st.get(k)),
  set: (k, v) => cardDB.op("readwrite", st => st.put(v, k)),
  del: k => cardDB.op("readwrite", st => st.delete(k)),
};
let wakeLock = null, cardUrl = null;
async function renderCard() {
  let img = null, num = "";
  try { img = await cardDB.get("image"); num = (await cardDB.get("number")) || ""; } catch {}
  if (cardUrl) URL.revokeObjectURL(cardUrl);
  cardUrl = img ? URL.createObjectURL(img) : null;
  const numHTML = `<div class="card-num"><input id="cardNum" inputmode="numeric" autocomplete="off" placeholder="N° de carte (facultatif)" value="${esc(num)}" aria-label="Numéro de carte">
    <button id="cardCopy" type="button">Copier</button></div>`;
  $("#cardBody").innerHTML = img
    ? `<img src="${cardUrl}" alt="Ma carte UGC Illimité">
       <p>Monte la luminosité de l'écran pour que le code se lise bien en caisse.</p>${numHTML}
       <div class="card-actions"><button class="ghost" id="cardPick">Changer l'image</button><button class="ghost" id="cardDel">Supprimer</button></div>`
    : `<p>Ajoute une capture d'écran de ta carte (depuis l'appli UGC ou une photo de la carte) pour l'avoir sous la main.</p>
       <p><b>Elle reste uniquement sur ce téléphone</b> : elle n'est envoyée nulle part et n'est pas publiée sur le site.</p>
       <div class="card-actions"><button id="cardPick">Ajouter ma carte</button></div>${numHTML}`;
  $("#cardBody").insertAdjacentHTML("beforeend", statsHTML());
}

// Films marqués « Déjà vu » ce mois-ci (sans notion de prix : il dépend du cinéma).
function statsHTML() {
  const month = parisNow().slice(0, 7);
  const ids = Object.entries(state.seenAt).filter(([, d]) => d && d.startsWith(month)).map(([id]) => id);
  const n = ids.length;
  const monthName = new Date(month + "-15T12:00:00").toLocaleDateString("fr-FR", { month: "long" });
  const titles = ids.map(id => state.data?.movies[id]?.title).filter(Boolean);
  return `<section class="stats">
    <h3>En ${esc(monthName)}</h3>
    <div class="stat-big">${n} film${n > 1 ? "s" : ""} vu${n > 1 ? "s" : ""}</div>
    ${titles.length ? `<p class="seenlist">${titles.map(esc).join(" · ")}</p>` : ""}
    <p class="hint">On compte les films que tu marques « Déjà vu » (bouton sur la fiche du film).</p>
  </section>`;
}
async function openCard() {
  await renderCard();
  $("#card").showModal();
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}  // garde l'écran allumé en caisse
}
$("#cardBtn").onclick = openCard;
$("#cardClose").onclick = () => $("#card").close();
$("#card").addEventListener("close", () => { wakeLock?.release?.(); wakeLock = null; });
$("#cardBody").addEventListener("click", async e => {
  if (e.target.id === "cardPick") $("#cardFile").click();
  if (e.target.id === "cardDel" && confirm("Supprimer la carte de ce téléphone ?")) { await cardDB.del("image"); renderCard(); }
  if (e.target.id === "cardCopy") {
    const v = $("#cardNum").value.trim(); if (!v) return;
    try { await navigator.clipboard.writeText(v); e.target.textContent = "Copié ✓"; } catch { $("#cardNum").select(); }
  }
});
$("#cardBody").addEventListener("change", e => {
  if (e.target.id === "cardNum") cardDB.set("number", e.target.value.trim()).catch(() => {});
});
$("#cardFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { await cardDB.set("image", f); } catch { alert("Impossible d'enregistrer l'image sur ce téléphone."); }
  renderCard();
};
if (location.hash === "#carte") openCard();  // raccourci : …/#carte

// --- Installation (PWA) ---
let deferred;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const dismissed = store.get("installDismissed", false);
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferred = e;
  if (!standalone && !dismissed) $("#install").classList.add("show");
});
if (!standalone && !dismissed && /iphone|ipad/i.test(navigator.userAgent)) {
  $("#installText").textContent = "Pour l'installer : bouton Partager, puis « Sur l'écran d'accueil ».";
  $("#installBtn").hidden = true;
  $("#install").classList.add("show");
}
$("#installBtn").onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice; } $("#install").classList.remove("show"); };
$("#installClose").onclick = () => { store.set("installDismissed", true); $("#install").classList.remove("show"); };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

load();
</script>
