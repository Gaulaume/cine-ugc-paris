<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Séances Illimité</title>
<meta name="description" content="Toutes les séances des cinémas parisiens qui acceptent la carte UGC Illimité.">
<meta name="theme-color" content="#1B2A4E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Séances">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --enamel: #1B2A4E;      /* bleu émail des plaques parisiennes */
  --enamel-ink: #FFFFFF;
  --page: #E8EDF4;        /* gris-bleu froid */
  --surface: #FFFFFF;
  --ink: #16203A;
  --muted: #5B6680;
  --line: #CDD5E2;
  --ticket: #F2C230;      /* jaune « ticket » pour la prochaine séance */
  --ticket-ink: #1B2A4E;
  --ugc: #C9283A;
  --mk2: #222A3A;
  --indep: #23785A;
  --past: #A9B2C3;
  --focus: #2F6BFF;
  --radius-chip: 6px;
  --radius-sheet: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --enamel: #0F1A33; --page: #0B1326; --surface: #15203A; --ink: #E9EEF7;
    --muted: #93A0BA; --line: #26324D; --past: #4A5672; --mk2: #8E9AB3; --ugc: #FF6170; --indep: #4DC596;
  }
}
:root[data-theme="dark"] {
  --enamel: #0F1A33; --page: #0B1326; --surface: #15203A; --ink: #E9EEF7;
  --muted: #93A0BA; --line: #26324D; --past: #4A5672; --mk2: #8E9AB3; --ugc: #FF6170; --indep: #4DC596;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 400 16px/1.45 "Barlow", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.cond { font-family: "Barlow Condensed", "Barlow", sans-serif; }
.app { max-width: 640px; margin: 0 auto; min-height: 100dvh; }

/* --- Bandeau émail --- */
.plate {
  background: var(--enamel); color: var(--enamel-ink);
  padding: calc(env(safe-area-inset-top) + 14px) 16px 16px;
  position: sticky; top: 0; z-index: 5;
  border-bottom: 3px solid var(--ticket);
}
.plate h1 {
  margin: 0 0 10px; font: 700 26px/1 "Barlow Condensed", sans-serif; letter-spacing: .01em;
  display: flex; align-items: center; gap: 10px;
}
.plate h1 .back {
  border: 0; background: none; padding: 4px 6px 4px 0; display: none; color: inherit; font-size: 26px; line-height: 1;
}
.app.film-mode .plate h1 .back { display: inline-block; }
/* Sur la fiche d'un film, on masque la recherche pour laisser la place aux séances. */
.app.film-mode .search { display: none; }
.app.film-mode .days { margin-top: 0; }
.search {
  display: flex; align-items: center; gap: 8px; background: #fff; color: #16203A;
  border-radius: 10px; padding: 0 12px; height: 46px;
}
.search input { flex: 1; border: 0; outline: 0; background: none; font-size: 17px; min-width: 0; }
.search svg { flex: none; opacity: .55; }
.search .clear { border: 0; background: none; padding: 6px; font-size: 18px; opacity: .5; display: none; }
.search.has-text .clear { display: block; }

.days {
  display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px;
  scrollbar-width: none;
}
.days::-webkit-scrollbar { display: none; }
.day {
  flex: none; border: 1.5px solid rgba(255,255,255,.35); background: none; color: #fff;
  border-radius: var(--radius-chip); padding: 5px 10px; text-align: center; min-width: 54px;
  font-family: "Barlow Condensed", sans-serif;
}
.day b { display: block; font-size: 19px; font-weight: 600; line-height: 1.05; }
.day span { font-size: 13px; opacity: .8; }
.day[aria-pressed="true"] { background: var(--ticket); color: var(--ticket-ink); border-color: var(--ticket); }

/* --- Filtres --- */
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 13px; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.chip select { border: 0; background: none; appearance: none; -webkit-appearance: none; padding-right: 2px; }

.status { padding: 6px 16px 0; font-size: 13px; color: var(--muted); }

/* --- Liste des films --- */
.films { list-style: none; margin: 0; padding: 8px 16px 32px; display: grid; gap: 2px; }
.film-row {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
  width: 100%; border: 0; background: var(--surface); text-align: left; padding: 10px 12px 10px 10px;
}
.films li:first-child .film-row { border-radius: 12px 12px 0 0; }
.films li:last-child .film-row { border-radius: 0 0 12px 12px; }
.films li:only-child .film-row { border-radius: 12px; }
.poster {
  width: 52px; aspect-ratio: 2/3; border-radius: 4px; background: var(--line) center/cover no-repeat;
  display: grid; place-items: center; color: var(--muted); font: 600 20px "Barlow Condensed";
}
.film-row h2 { margin: 0; font: 600 20px/1.1 "Barlow Condensed", sans-serif; }
.badge {
  display: inline-block; margin-bottom: 3px; padding: 2px 7px 1px; border-radius: 4px;
  background: var(--ticket); color: var(--ticket-ink); font: 600 12px/1.3 "Barlow", sans-serif;
  text-transform: uppercase; letter-spacing: .04em;
}
.film-row p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.next { text-align: right; font-family: "Barlow Condensed"; line-height: 1.1; }
.next b { display: block; font-size: 20px; font-weight: 600; }
.next small { font-size: 12px; color: var(--muted); }

/* --- Fiche film --- */
.film-head { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 16px; align-items: end; }
.film-head .poster { width: 96px; border-radius: 6px; font-size: 32px; }
.film-head h2 { margin: 0; font: 700 30px/1.02 "Barlow Condensed", sans-serif; }
.film-head p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.film-head .ext { display: inline-block; margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--focus); text-decoration: none; }
.view-toggle { display: flex; margin: 0 16px; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.view-toggle button { flex: 1; border: 0; background: var(--surface); padding: 8px; font-size: 14px; font-weight: 600; }
.view-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--page); }

.cinemas { list-style: none; margin: 0; padding: 12px 16px 40px; display: grid; gap: 10px; }
.cine { background: var(--surface); border-radius: 12px; padding: 12px; }
.cine-top { display: flex; align-items: center; gap: 10px; }
.arr {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font: 700 15px "Barlow Condensed"; color: #fff; background: var(--indep);
}
.arr.UGC { background: var(--ugc); }
.arr.MK2 { background: var(--mk2); }
.cine-name { flex: 1; min-width: 0; }
.cine-name h3 { margin: 0; font: 600 19px/1.1 "Barlow Condensed"; }
.cine-name a { color: var(--muted); font-size: 13px; text-decoration: none; }
.cine-name a:hover { text-decoration: underline; }
.star { border: 0; background: none; padding: 6px; font-size: 20px; color: var(--muted); line-height: 1; }
.star[aria-pressed="true"] { color: #E0A800; }
.times { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.time {
  font-family: "Barlow Condensed"; font-size: 18px; font-weight: 600; line-height: 1;
  padding: 7px 9px 6px; border-radius: var(--radius-chip); border: 1.5px solid var(--line);
  display: inline-flex; align-items: baseline; gap: 5px;
}
a.time { color: inherit; text-decoration: none; }
.time small { font-size: 12px; font-weight: 500; color: var(--muted); }
.time.vf { border-style: dashed; }
.time.soon { background: var(--ticket); border-color: var(--ticket); color: var(--ticket-ink); }
.time.soon small { color: var(--ticket-ink); }
.time.past { color: var(--past); border-color: transparent; text-decoration: line-through; }
.time.past small { color: var(--past); }

.time .end { font-style: normal; font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 1px; }
.time.soon .end { color: var(--ticket-ink); opacity: .75; }
.cine-name .dist { display: block; font-size: 12px; color: var(--muted); }
.cine-name .dist a { font-size: 12px; color: var(--focus); font-weight: 500; }
.pastlink { display: block; margin: 10px 16px 0; border: 0; background: none; padding: 4px 0; color: var(--focus); font-size: 14px; font-weight: 500; text-decoration: underline; }

/* Vue chronologique */
.timeline { list-style: none; margin: 0; padding: 12px 16px 40px; }
.timeline li { border-bottom: 1px solid var(--line); }
.timeline .row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; align-items: center; color: inherit; text-decoration: none; }
.timeline .go { margin-left: auto; padding-left: 4px; font-size: 22px; line-height: 1; color: var(--muted); }
.timeline .when { font: 600 22px/1 "Barlow Condensed"; }
.timeline .when.past { color: var(--past); }
.timeline .when small { display: block; font: 500 12px/1.3 "Barlow", sans-serif; color: var(--muted); margin-top: 2px; }
.soonlist .row { grid-template-columns: 64px 1fr auto; }
.soonlist .what { min-width: 0; }
.soonlist .what > b { display: block; font: 600 18px/1.15 "Barlow Condensed", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.soonlist .where { margin-top: 3px; font-size: 14px; }
.soonlist .where small { color: var(--muted); }
.timeline .sep { display: block; padding: 14px 0 4px; font: 600 13px "Barlow", sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border: 0; }
.timeline .where { display: flex; gap: 8px; align-items: center; min-width: 0; }
.timeline .where span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timeline .arr { width: 24px; height: 24px; font-size: 13px; }

.legend { margin: 10px 16px 0; font-size: 12px; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

.empty { padding: 48px 24px; text-align: center; color: var(--muted); }
.empty h2 { color: var(--ink); font: 600 22px "Barlow Condensed"; margin: 0 0 6px; }

.install {
  margin: 12px 16px 0; background: var(--surface); border-radius: 12px; padding: 12px 14px;
  display: none; gap: 10px; align-items: center; font-size: 14px;
}
.install.show { display: flex; }
.install p { margin: 0; flex: 1; }
.install button { border: 0; background: var(--enamel); color: #fff; border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.install .x { background: none; color: var(--muted); padding: 6px; }

/* --- Ma carte --- */
.cardbtn {
  margin-left: auto; border: 1.5px solid rgba(255,255,255,.4); background: none; color: #fff;
  border-radius: 999px; padding: 5px 11px; font: 600 14px "Barlow", sans-serif; white-space: nowrap;
}
dialog.card {
  width: 100%; max-width: 640px; height: 100dvh; max-height: none; margin: 0 auto; border: 0; padding: 0;
  background: #fff; color: #16203A;
}
dialog.card::backdrop { background: rgba(0,0,0,.6); }
.card-top { display: flex; align-items: center; padding: calc(env(safe-area-inset-top) + 12px) 16px 8px; }
.card-top h2 { margin: 0; flex: 1; font: 700 24px "Barlow Condensed", sans-serif; }
.card-top .x { border: 0; background: none; font-size: 22px; padding: 6px; color: inherit; }
#cardBody { padding: 8px 16px 24px; }
#cardBody img { display: block; width: 100%; max-height: 70dvh; object-fit: contain; border-radius: 12px; }
#cardBody p { color: #5B6680; font-size: 14px; margin: 10px 0; }
.card-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.card-actions button { border: 0; border-radius: 10px; padding: 11px 16px; font: 600 15px "Barlow", sans-serif; background: #1B2A4E; color: #fff; }
.card-actions button.ghost { background: #E8EDF4; color: #16203A; }
.card-num { display: flex; gap: 8px; margin-top: 14px; }
.card-num input { flex: 1; min-width: 0; border: 1.5px solid #CDD5E2; border-radius: 10px; padding: 10px 12px; font: 500 17px "Barlow", sans-serif; letter-spacing: .04em; }
.card-num button { border: 0; border-radius: 10px; padding: 0 14px; background: #F2C230; color: #1B2A4E; font: 600 14px "Barlow", sans-serif; }

[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  .cinemas, .films, .timeline { animation: in .18s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="plate">
    <h1><button class="back" id="back" aria-label="Retour à la liste des films">‹</button><span id="title">Séances Illimité</span><button class="cardbtn" id="cardBtn" aria-haspopup="dialog">🎟 Ma carte</button></h1>
    <label class="search" id="searchBox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Chercher un film" autocomplete="off" enterkeyhint="search" aria-label="Chercher un film">
      <button class="clear" id="clear" type="button" aria-label="Effacer">✕</button>
    </label>
    <div class="days" id="days" role="group" aria-label="Jour"></div>
  </header>

  <div class="install" id="install">
    <p id="installText">Installe l'appli sur ton écran d'accueil.</p>
    <button id="installBtn">Installer</button>
    <button class="x" id="installClose" aria-label="Masquer">✕</button>
  </div>

  <div class="filters" role="group" aria-label="Filtres">
    <button class="chip" data-f="soon" aria-pressed="false">⚡ Maintenant</button>
    <button class="chip" data-f="near" aria-pressed="false">📍 Près de moi</button>
    <button class="chip" data-f="nouv" aria-pressed="false">✦ Nouveautés</button>
    <button class="chip" data-f="vo" aria-pressed="false">VO</button>
    <button class="chip" data-f="vf" aria-pressed="false">VF</button>
    <button class="chip" data-f="fav" aria-pressed="false">★ Mes salles</button>
    <label class="chip"><select id="group" aria-label="Enseigne">
      <option value="">Toutes enseignes</option><option>UGC</option><option>MK2</option><option value="Indépendant">Indépendants</option>
    </select></label>
    <label class="chip"><select id="arr" aria-label="Arrondissement"><option value="">Tous arrondissements</option></select></label>
  </div>
  <div class="status" id="status" aria-live="polite"></div>

  <main id="main"></main>

  <!-- Ma carte UGC : capture gardée uniquement sur ce téléphone (IndexedDB), jamais envoyée. -->
  <dialog class="card" id="card" aria-label="Ma carte UGC Illimité">
    <div class="card-top"><h2>Ma carte</h2><button class="x" id="cardClose" aria-label="Fermer">✕</button></div>
    <div id="cardBody"></div>
    <input type="file" id="cardFile" accept="image/*" hidden>
  </dialog>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const state = {
  // VO/VF mémorisés ; VO par défaut (cache seulement les films doublés).
  data: null, day: null, q: "", nouv: false, vo: store.get("vo", true), vf: store.get("vf", false), fav: false,
  soon: false, near: false, pos: null, showPast: false,
  group: "", arr: "", view: store.get("view", "salle"), favs: new Set(store.get("favs", [])),
};

const DOW = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
const parisNow = () => {
  // Heure locale de Paris au format "AAAA-MM-JJTHH:MM", quel que soit le fuseau du téléphone.
  const p = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(new Date());
  return p.replace(" ", "T");
};

async function load() {
  $("#status").textContent = "Chargement des séances…";
  try {
    const res = await fetch("data/showtimes.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    state.data = await res.json();
  } catch {
    $("#main").innerHTML = `<div class="empty"><h2>Pas encore de séances</h2><p>Les horaires n'ont pas pu être chargés. Vérifie ta connexion, puis rouvre l'appli.</p></div>`;
    $("#status").textContent = "";
    return;
  }
  const today = parisNow().slice(0, 10);
  state.data.days = state.data.days.filter(d => d >= today);
  state.day = state.data.days[0] || today;
  // Index par film pour aller vite.
  state.byMovie = new Map();
  for (const s of state.data.showtimes) {
    if (!state.byMovie.has(s[0])) state.byMovie.set(s[0], []);
    state.byMovie.get(s[0]).push(s);
  }
  const arrs = [...new Set(Object.values(state.data.theaters).map(t => t.arr))].sort((a, b) => a - b);
  $("#arr").insertAdjacentHTML("beforeend", arrs.map(a => `<option value="${a}">${a === 1 ? "1er" : a + "e"} arr.</option>`).join(""));
  renderDays();
  syncChips();
  route();
}

function renderDays() {
  $("#days").innerHTML = state.data.days.map((d, i) => {
    const dt = new Date(d + "T12:00:00");
    const label = i === 0 ? "auj." : i === 1 ? "dem." : DOW[dt.getDay()];
    return `<button class="day" data-day="${d}" aria-pressed="${d === state.day}"><b>${dt.getDate()}</b><span>${label}</span></button>`;
  }).join("");
}

function filtered(list) {
  const now = parisNow();
  return list.filter(s => {
    if (!s[2].startsWith(state.day)) return false;
    // VO = tout sauf les films doublés ; VF = tout ce qui est en français (doublé ou film français).
    if (state.vo && !state.vf && s[3] === "VF") return false;
    if (state.vf && !state.vo && s[3] === "VO") return false;
    if (!state.showPast && s[2] < now) return false;  // séances passées masquées par défaut
    const t = state.data.theaters[s[1]];
    if (!t) return false;
    if (state.group && t.group !== state.group) return false;
    if (state.arr && String(t.arr) !== state.arr) return false;
    if (state.fav && !state.favs.has(s[1])) return false;
    return true;
  });
}

// Nouveautés : films sortis depuis 7 jours, ou pas encore sortis (avant-premières).
const today = () => parisNow().slice(0, 10);
const weekAgo = () => { const d = new Date(today() + "T12:00:00"); d.setDate(d.getDate() - 7); return d.toISOString().slice(0, 10); };
const isNew = m => !!m.release && m.release >= weekAgo();
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", d.slice(0, 4) === today().slice(0, 4)
  ? { weekday: "short", day: "numeric", month: "short" } : { day: "numeric", month: "short", year: "numeric" });
const badge = m => !isNew(m) ? "" : m.release > today()
  ? `<span class="badge">Sortie ${esc(fmtDay(m.release))}</span>` : `<span class="badge">Nouveau</span>`;

// Fin estimée : début + durée du film + ~15 min de pubs et bandes-annonces.
const ADS_MIN = 15;
const runtimeMin = m => { const r = /(?:(\d+)h)?\s*(\d+)?\s*min/.exec(m?.runtime || ""); return r ? (+r[1] || 0) * 60 + (+r[2] || 0) : 0; };
const endTime = s => {
  const d = runtimeMin(state.data.movies[s[0]]); if (!d) return "";
  const [h, mi] = s[2].slice(11).split(":").map(Number), t = h * 60 + mi + d + ADS_MIN;
  return `${String(Math.floor(t / 60) % 24).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
};

// « Près de moi » : distance à vol d'oiseau (km) et temps à pied (~4,5 km/h, détours compris).
const distKm = t => {
  if (!state.near || !state.pos || !t?.geo) return Infinity;
  const r = Math.PI / 180, [la, lo] = t.geo, { lat, lon } = state.pos;
  const a = Math.sin((la - lat) * r / 2) ** 2 + Math.cos(lat * r) * Math.cos(la * r) * Math.sin((lo - lon) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(a));
};
const distLabel = t => {
  const km = distKm(t); if (!isFinite(km)) return "";
  const walk = Math.round(km * 1.25 / 4.5 * 60);
  return `${km < 0.1 ? "< 100 m" : km < 1 ? Math.round(km * 10) * 100 + " m" : km.toFixed(1).replace(".", ",") + " km"}${walk <= 30 ? ` · ${Math.max(walk, 1)} min à pied` : ""}`;  // au-delà, on prend le métro
};
// Itinéraire Google Maps vers la salle (depuis la position du téléphone).
// Fiche Letterboxd (recherche par titre original : Letterboxd n'a pas d'API publique pour les notes).
const letterboxdUrl = m => "https://letterboxd.com/search/films/" + encodeURIComponent(m.original || m.title) + "/";
const mapsUrl = t => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(`${t.name}, ${t.address}, ${t.zip} Paris`);
const rating = m => m.rating ? ` · ★ ${String(m.rating).replace(".", ",")}` : "";
const arrBadge = (t, cls = "arr") => `<span class="${cls} ${t.group === "Indépendant" ? "" : t.group}">${t.arr}</span>`;

// « FR » (film français) n'est pas affiché : la version va de soi.
const label = s => [s[3] === "FR" ? "" : s[3], ...s[4]].filter(Boolean).join(" ");

const posterHTML = (m, cls = "poster") => m.poster
  ? `<div class="${cls}" style="background-image:url('${esc(m.poster)}')" role="img" aria-label="Affiche"></div>`
  : `<div class="${cls}" aria-hidden="true">${esc((m.title || "?")[0])}</div>`;

function renderList() {
  if (state.soon) return renderSoon();
  $("#app").classList.remove("film-mode");
  $("#title").textContent = "Séances Illimité";
  const q = norm(state.q).trim();
  const now = parisNow();
  const rows = [];
  for (const [id, list] of state.byMovie) {
    const m = state.data.movies[id];
    if (!m) continue;
    if (q && !norm(m.title).includes(q) && !norm(m.original).includes(q)) continue;
    if (state.nouv && !isNew(m)) continue;
    const shows = filtered(list);
    if (!shows.length) continue;
    const upcoming = shows.filter(s => s[2] >= now);
    const theaters = new Set(shows.map(s => s[1]));
    rows.push({ id, m, n: shows.length, theaters: theaters.size, next: upcoming[0]?.[2] });
  }
  // Nouveautés : films déjà sortis (le plus récent d'abord), puis à venir (le plus proche d'abord).
  const t0 = today();
  const byRelease = (a, b) => {
    const fa = a.m.release > t0, fb = b.m.release > t0;
    return fa !== fb ? fa - fb : fa ? a.m.release.localeCompare(b.m.release) : b.m.release.localeCompare(a.m.release);
  };
  rows.sort((a, b) => (state.nouv && byRelease(a, b)) || b.theaters - a.theaters || b.n - a.n);
  setStatus(rows.length ? `${rows.length} film${rows.length > 1 ? "s" : ""}` : "");
  if (!rows.length) {
    $("#main").innerHTML = emptyHTML("Aucun film trouvé", q ? "Vérifie l'orthographe ou enlève des filtres." : "Change de jour ou enlève des filtres.");
    return;
  }
  $("#main").innerHTML = `<ul class="films">${rows.map(r => `
    <li><button class="film-row" data-film="${r.id}">
      ${posterHTML(r.m)}
      <div>${badge(r.m)}<h2>${esc(r.m.title)}</h2><p>${r.theaters} salle${r.theaters > 1 ? "s" : ""} · ${r.n} séance${r.n > 1 ? "s" : ""}${r.m.runtime ? " · " + esc(r.m.runtime) : ""}${rating(r.m)}</p></div>
      <div class="next">${r.next ? `<b>${r.next.slice(11)}</b><small>prochaine</small>` : `<small>terminé</small>`}</div>
    </button></li>`).join("")}</ul>`;
}

// Message vide, avec une explication si « Près de moi » n'a pas encore de distances.
function emptyHTML(title, hint) {
  return `<div class="empty"><h2>${esc(title)}</h2><p>${esc(hint)}</p></div>`;
}

// « Maintenant » : toutes les séances qui commencent dans les 90 minutes, tous films confondus.
const SOON_MIN = 90;
function renderSoon() {
  $("#app").classList.remove("film-mode");
  $("#title").textContent = "Séances Illimité";
  const now = parisNow(), q = norm(state.q).trim();
  const until = new Date(Date.now() + SOON_MIN * 60000);
  const limit = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(until).replace(" ", "T");
  const shows = filtered(state.data.showtimes).filter(s => s[2] >= now && s[2] <= limit && (!q || norm(state.data.movies[s[0]]?.title).includes(q)));
  const zone = s => state.near ? Math.min(Math.floor(distKm(state.data.theaters[s[1]]) * 1.25 / 4.5 * 6), 9) : 0;  // tranches de 10 min à pied
  shows.sort((a, b) => (state.favs.has(b[1]) - state.favs.has(a[1])) || zone(a) - zone(b) || a[2].localeCompare(b[2]));
  setStatus(shows.length ? `${shows.length} séance${shows.length > 1 ? "s" : ""} dans les ${SOON_MIN} min` : "");
  if (!shows.length) {
    $("#main").innerHTML = emptyHTML(`Rien dans les ${SOON_MIN} prochaines minutes`, "Enlève des filtres ou regarde la liste des films.");
    return;
  }
  const favCount = shows.filter(s => state.favs.has(s[1])).length;
  $("#main").innerHTML = `<ul class="timeline soonlist">${shows.map((s, i) => {
    const t = state.data.theaters[s[1]], m = state.data.movies[s[0]], url = s[5] || t.allocine, end = endTime(s);
    const head = i === 0 && favCount ? `<li class="sep">★ Dans tes salles</li>` : i === favCount && favCount ? `<li class="sep">Ailleurs</li>` : "";
    return `${head}<li><a class="row" href="${esc(url)}" target="_blank" rel="noopener">
      <div class="when">${s[2].slice(11)}${end ? `<small>→ ${end}</small>` : ""}</div>
      <div class="what"><b>${esc(m.title)}</b><span class="where">${arrBadge(t)}<span>${esc(t.name)}</span><small>${esc([label(s), distLabel(t)].filter(Boolean).join(" · "))}</small></span></div>
      <b class="go" aria-hidden="true">›</b></a></li>`;
  }).join("")}</ul>`;
}

function renderFilm(id) {
  const m = state.data.movies[id];
  if (!m) { location.hash = ""; return; }
  $("#app").classList.add("film-mode");
  $("#title").textContent = "Séances Illimité";
  const now = parisNow();
  const shows = filtered(state.byMovie.get(id) || []);
  // Lien pour réafficher les séances passées (aujourd'hui seulement).
  const pastN = state.day === today() && !state.showPast
    ? (({ showPast }) => { state.showPast = true; const n = filtered(state.byMovie.get(id) || []).filter(s => s[2] < now).length; state.showPast = showPast; return n; })(state) : 0;
  const pastLink = state.showPast && state.day === today()
    ? `<button class="pastlink" data-past="0">Masquer les séances passées</button>`
    : pastN ? `<button class="pastlink" data-past="1">Voir les ${pastN} séance${pastN > 1 ? "s" : ""} déjà passée${pastN > 1 ? "s" : ""}</button>` : "";
  const meta = [m.release && (m.release > today() ? "sortie le " : "sorti le ") + fmtDay(m.release), m.runtime, m.rating && "★ " + String(m.rating).replace(".", ",") + "/5 AlloCiné", m.genres?.slice(0, 2).join(", "), m.directors?.length ? "de " + m.directors.join(", ") : ""].filter(Boolean).join(" · ");
  const orig = m.original && norm(m.original) !== norm(m.title) ? `<p>${esc(m.original)}</p>` : "";
  let body;
  if (!shows.length) {
    body = emptyHTML(pastN ? "Plus de séance aujourd'hui" : "Pas de séance ce jour-là", "Essaie un autre jour ou enlève des filtres.");
  } else if (state.view === "heure") {
    body = `<ul class="timeline">${shows.map(s => {
      const t = state.data.theaters[s[1]];
      // Toute la ligne ouvre la réservation de cette séance sur le site du cinéma.
      const url = s[2] >= now && (s[5] || t.allocine);
      const row = url ? `a class="row" href="${esc(url)}" target="_blank" rel="noopener"` : `div class="row"`;
      const end = endTime(s), fav = state.favs.has(s[1]) ? "★ " : "";
      return `<li><${row}><div class="when ${s[2] < now ? "past" : ""}">${s[2].slice(11)}${end ? `<small>→ ${end}</small>` : ""}</div>
        <div class="where">${arrBadge(t)}<span>${fav}${esc(t.name)}</span><small>${esc([label(s), distLabel(t)].filter(Boolean).join(" · "))}</small>${url ? `<b class="go" aria-hidden="true">›</b>` : ""}</div></${row.split(" ")[0]}></li>`;
    }).join("")}</ul>`;
  } else {
    const byT = new Map();
    for (const s of shows) { if (!byT.has(s[1])) byT.set(s[1], []); byT.get(s[1]).push(s); }
    const groups = [...byT.entries()].map(([tid, list]) => ({ tid, t: state.data.theaters[tid], list, next: list.find(s => s[2] >= now)?.[2] || "~" }));
    // Mes salles d'abord, puis les plus proches (si localisé), puis la prochaine séance.
    groups.sort((a, b) => (state.favs.has(b.tid) - state.favs.has(a.tid)) || (state.near ? distKm(a.t) - distKm(b.t) || 0 : 0)
      || a.next.localeCompare(b.next) || a.t.arr - b.t.arr);
    body = `<ul class="cinemas">${groups.map(g => {
      let soonDone = false;
      const times = g.list.map(s => {
        const past = s[2] < now;
        let cls = past ? "past" : "";
        if (!past && !soonDone) { cls = "soon"; soonDone = true; }
        if (s[3] === "VF") cls += " vf";
        const end = endTime(s);
        const inner = `${s[2].slice(11)}<small>${esc(label(s))}</small>${end && !past ? `<i class="end">→ ${end}</i>` : ""}`;
        const url = !past && (s[5] || g.t.allocine);
        return url ? `<a class="time ${cls}" href="${esc(url)}" target="_blank" rel="noopener" aria-label="Réserver la séance de ${s[2].slice(11)}">${inner}</a>`
                   : `<span class="time ${cls}">${inner}</span>`;
      }).join("");
      const fav = state.favs.has(g.tid);
      return `<li class="cine">
        <div class="cine-top">${arrBadge(g.t)}
          <div class="cine-name"><h3>${esc(g.t.name)}</h3>${g.t.allocine ? `<a href="${esc(g.t.allocine)}" target="_blank" rel="noopener">${esc(g.t.address)} · la salle</a>` : `<span>${esc(g.t.address)}</span>`}<small class="dist">${distLabel(g.t) ? esc(distLabel(g.t)) + " · " : ""}<a href="${esc(mapsUrl(g.t))}" target="_blank" rel="noopener">Itinéraire ↗</a></small></div>
          <button class="star" data-star="${esc(g.tid)}" aria-pressed="${fav}" aria-label="${fav ? "Retirer de mes salles" : "Ajouter à mes salles"}">${fav ? "★" : "☆"}</button></div>
        <div class="times">${times}</div></li>`;
    }).join("")}</ul>`;
  }
  const nT = new Set(shows.map(s => s[1])).size;
  setStatus(shows.length ? `${shows.length} séance${shows.length > 1 ? "s" : ""} dans ${nT} salle${nT > 1 ? "s" : ""}` : "");
  $("#main").innerHTML = `
    <div class="film-head">${posterHTML(m)}<div><h2>${esc(m.title)}</h2>${orig}<p>${esc(meta)}</p><a class="ext" href="${esc(letterboxdUrl(m))}" target="_blank" rel="noopener">Note Letterboxd ↗</a></div></div>
    <div class="view-toggle" role="group" aria-label="Affichage">
      <button data-view="salle" aria-pressed="${state.view === "salle"}">Par salle</button>
      <button data-view="heure" aria-pressed="${state.view === "heure"}">Par heure</button>
    </div>
    <div class="legend"><span><i style="background:var(--ugc)"></i>UGC</span><span><i style="background:var(--mk2)"></i>MK2</span><span><i style="background:var(--indep)"></i>Indé</span><span>n° = arrondissement</span><span>→ fin estimée, pubs comprises</span></div>
    ${pastLink}${body}`;
}

function setStatus(extra) {
  const d = state.data;
  const upd = d.generatedAt ? new Date(d.generatedAt) : null;
  const when = upd ? upd.toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris" }) : "";
  $("#status").textContent = [extra, when && `mis à jour ${when}`].filter(Boolean).join(" — ");
}

function route() {
  if (!state.data) return;
  const m = location.hash.match(/^#\/film\/(\w+)/);
  m ? renderFilm(m[1]) : renderList();
}

// --- Événements ---
window.addEventListener("hashchange", () => { state.showPast = false; route(); window.scrollTo(0, 0); });
$("#back").onclick = () => history.length > 1 ? history.back() : (location.hash = "");
$("#q").addEventListener("input", e => {
  state.q = e.target.value;
  $("#searchBox").classList.toggle("has-text", !!state.q);
  if (location.hash) location.hash = ""; else renderList();
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("#clear").onclick = () => { $("#q").value = ""; state.q = ""; $("#searchBox").classList.remove("has-text"); route(); $("#q").focus(); };
$("#days").onclick = e => {
  const b = e.target.closest("[data-day]"); if (!b) return;
  state.day = b.dataset.day; state.soon = false; syncChips(); renderDays(); route();
};
const syncChips = () => document.querySelectorAll("[data-f]").forEach(b => b.setAttribute("aria-pressed", !!state[b.dataset.f]));
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  const f = b.dataset.f;
  if (f === "near" && !state.near && !state.pos) return locate();
  state[f] = !state[f];
  if (f === "vo" || f === "vf") store.set(f, state[f]);
  if (f === "soon" && state.soon) {  // « Maintenant » = aujourd'hui, depuis la liste des films
    state.day = state.data.days[0]; renderDays();
    if (location.hash) { syncChips(); location.hash = ""; return; }
  }
  syncChips(); route();
});
function locate() {
  if (!navigator.geolocation) { setStatus("Localisation indisponible sur cet appareil"); return; }
  setStatus("Localisation en cours…");
  navigator.geolocation.getCurrentPosition(p => {
    state.pos = { lat: p.coords.latitude, lon: p.coords.longitude }; state.near = true; syncChips(); route();
  }, () => setStatus("Localisation refusée : autorise-la dans les réglages du navigateur."), { timeout: 10000, maximumAge: 300000 });
}
$("#group").onchange = e => { state.group = e.target.value; route(); };
$("#arr").onchange = e => { state.arr = e.target.value; route(); };
$("#main").addEventListener("click", e => {
  const film = e.target.closest("[data-film]");
  if (film) { location.hash = `#/film/${film.dataset.film}`; return; }
  const past = e.target.closest("[data-past]");
  if (past) { state.showPast = past.dataset.past === "1"; route(); return; }
  const v = e.target.closest("[data-view]");
  if (v) { state.view = v.dataset.view; store.set("view", state.view); route(); return; }
  const star = e.target.closest("[data-star]");
  if (star) {
    const id = star.dataset.star;
    state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
    store.set("favs", [...state.favs]); route();
  }
});
// Rafraîchit les séances passées toutes les minutes.
setInterval(() => { if (state.data && document.visibilityState === "visible") route(); }, 60000);

// --- Ma carte UGC (stockée uniquement sur l'appareil, dans IndexedDB) ---
const cardDB = {
  open: () => new Promise((ok, ko) => {
    const r = indexedDB.open("ma-carte", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  }),
  async op(mode, fn) {
    const db = await this.open();
    return new Promise((ok, ko) => {
      const tx = db.transaction("kv", mode), req = fn(tx.objectStore("kv"));
      tx.oncomplete = () => ok(req.result); tx.onerror = () => ko(tx.error);
    });
  },
  get: k => cardDB.op("readonly", st => st.get(k)),
  set: (k, v) => cardDB.op("readwrite", st => st.put(v, k)),
  del: k => cardDB.op("readwrite", st => st.delete(k)),
};
let wakeLock = null, cardUrl = null;
async function renderCard() {
  let img = null, num = "";
  try { img = await cardDB.get("image"); num = (await cardDB.get("number")) || ""; } catch {}
  if (cardUrl) URL.revokeObjectURL(cardUrl);
  cardUrl = img ? URL.createObjectURL(img) : null;
  const numHTML = `<div class="card-num"><input id="cardNum" inputmode="numeric" autocomplete="off" placeholder="N° de carte (facultatif)" value="${esc(num)}" aria-label="Numéro de carte">
    <button id="cardCopy" type="button">Copier</button></div>`;
  $("#cardBody").innerHTML = img
    ? `<img src="${cardUrl}" alt="Ma carte UGC Illimité">
       <p>Monte la luminosité de l'écran pour que le code se lise bien en caisse.</p>${numHTML}
       <div class="card-actions"><button class="ghost" id="cardPick">Changer l'image</button><button class="ghost" id="cardDel">Supprimer</button></div>`
    : `<p>Ajoute une capture d'écran de ta carte (depuis l'appli UGC ou une photo de la carte) pour l'avoir sous la main.</p>
       <p><b>Elle reste uniquement sur ce téléphone</b> : elle n'est envoyée nulle part et n'est pas publiée sur le site.</p>
       <div class="card-actions"><button id="cardPick">Ajouter ma carte</button></div>${numHTML}`;
}
async function openCard() {
  await renderCard();
  $("#card").showModal();
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}  // garde l'écran allumé en caisse
}
$("#cardBtn").onclick = openCard;
$("#cardClose").onclick = () => $("#card").close();
$("#card").addEventListener("close", () => { wakeLock?.release?.(); wakeLock = null; });
$("#cardBody").addEventListener("click", async e => {
  if (e.target.id === "cardPick") $("#cardFile").click();
  if (e.target.id === "cardDel" && confirm("Supprimer la carte de ce téléphone ?")) { await cardDB.del("image"); renderCard(); }
  if (e.target.id === "cardCopy") {
    const v = $("#cardNum").value.trim(); if (!v) return;
    try { await navigator.clipboard.writeText(v); e.target.textContent = "Copié ✓"; } catch { $("#cardNum").select(); }
  }
});
$("#cardBody").addEventListener("change", e => {
  if (e.target.id === "cardNum") cardDB.set("number", e.target.value.trim()).catch(() => {});
});
$("#cardFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { await cardDB.set("image", f); } catch { alert("Impossible d'enregistrer l'image sur ce téléphone."); }
  renderCard();
};
if (location.hash === "#carte") openCard();  // raccourci : …/#carte

// --- Installation (PWA) ---
let deferred;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const dismissed = store.get("installDismissed", false);
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferred = e;
  if (!standalone && !dismissed) $("#install").classList.add("show");
});
if (!standalone && !dismissed && /iphone|ipad/i.test(navigator.userAgent)) {
  $("#installText").textContent = "Pour l'installer : bouton Partager, puis « Sur l'écran d'accueil ».";
  $("#installBtn").hidden = true;
  $("#install").classList.add("show");
}
$("#installBtn").onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice; } $("#install").classList.remove("show"); };
$("#installClose").onclick = () => { store.set("installDismissed", true); $("#install").classList.remove("show"); };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

load();
</script>
