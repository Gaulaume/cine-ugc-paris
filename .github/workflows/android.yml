name: Appli Android
on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Construire l'APK
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk cine.apk
      - uses: actions/upload-artifact@v4
        with: { name: cine-apk, path: cine.apk }
      # Lien de téléchargement fixe : …/releases/latest/download/cine.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Appli Android « Ciné »
          body: |
            Télécharger sur le téléphone : https://github.com/${{ github.repository }}/releases/latest/download/cine.apk
            Version ${{ github.run_number }}.
          files: cine.apk
          make_latest: true
