# TEMPORAIRE : format des dates de sortie (sera supprimé).
name: Diagnostic sorties
on:
  push:
    branches: [ccr-ebdfd861-fcj7rd]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import json, collections
          from datetime import date, timedelta
          from cineparis.allocine import AllocineClient
          c = AllocineClient(delay=0.2)
          want = {"Heart Of The Beast", "Toy Story 5", "Moulin", "Paris, Texas", "Garance", "Notre salut", "Street Fighter", "Spider-Man: Brand New Day"}
          seen = set(); names = collections.Counter()
          for tid in ["C0159", "C0026", "C0065", "C2954", "C0050", "C0013"]:
              for it in c.showtimes(tid, date.today() + timedelta(days=1)):
                  m = it["movie"]
                  for r in m.get("releases") or []:
                      names[(r.get("name"), json.dumps((r.get("releaseTags") or {}).get("tagTypes")), (r.get("releaseDate") or {}).get("precision"))] += 1
                  if m["title"] in want and m["title"] not in seen:
                      seen.add(m["title"])
                      prev = sum(1 for g in (it.get("showtimes") or {}).values() for s in g or [] if s.get("isPreview"))
                      tot = sum(len(g or []) for g in (it.get("showtimes") or {}).values())
                      print("==", m["title"], f"(avant-premières {prev}/{tot})")
                      for r in m.get("releases") or []:
                          print("   ", json.dumps({k: r.get(k) for k in ("name", "releaseDate", "releaseTags", "companyLimitation")}, ensure_ascii=False))
          print("== types de sorties"); [print("  ", v, k) for k, v in names.most_common(30)]
          PY
