# TEMPORAIRE : quels liens letterboxd.com ouvrent l'appli (sera supprimé).
name: Diagnostic Letterboxd
on:
  push:
    branches: [ccr-ebdfd861-fcj7rd]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install curl_cffi
      - run: |
          python - <<'PY'
          from curl_cffi import requests
          s = requests.Session(impersonate="chrome")
          for url in ["https://letterboxd.com/.well-known/apple-app-site-association",
                      "https://letterboxd.com/apple-app-site-association",
                      "https://letterboxd.com/.well-known/assetlinks.json"]:
              r = s.get(url, timeout=30)
              print("==", url, r.status_code, r.headers.get("content-type")); print(r.text[:3000])
          for url in ["https://letterboxd.com/search/films/Garance/", "https://letterboxd.com/search/Garance/",
                      "https://letterboxd.com/film/garance/", "https://letterboxd.com/film/the-social-reckoning/"]:
              r = s.get(url, timeout=30, allow_redirects=False)
              print("==", url, r.status_code, r.headers.get("location"))
          PY
