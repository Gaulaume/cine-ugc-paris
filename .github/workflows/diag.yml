# TEMPORAIRE : format du calendrier des sorties AlloCiné (sera supprimé).
name: Diagnostic sorties à venir
on:
  push:
    branches: [ccr-ebdfd861-fcj7rd]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import re, html
          from datetime import date, timedelta
          from cineparis.allocine import AllocineClient
          c = AllocineClient(delay=0.3)
          wed = date.today() + timedelta(days=(2 - date.today().weekday()) % 7 or 7)
          for url in ["https://www.allocine.fr/film/agenda/", f"https://www.allocine.fr/film/agenda/sem-{wed.isoformat()}/"]:
              r = c._get(url)
              t = r.text
              print("==", url, r.status_code, len(t))
              cards = t.split('class="card entity-card entity-card-list')
              print("cartes:", len(cards) - 1)
              for chunk in cards[1:3]:
                  print("---- carte ----")
                  print(re.sub(r"\s+", " ", chunk[:3500]))
              m = re.findall(r'href="(/film/agenda/sem-[0-9-]+/)"', t)
              print("liens semaines:", sorted(set(m))[:12])
          PY
