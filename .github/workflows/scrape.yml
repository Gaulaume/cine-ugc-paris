name: Mise à jour des séances
on:
  schedule:
    - cron: "17 4,10,15 * * *"   # ~6h, 12h, 17h à Paris
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: scrape, cancel-in-progress: false }
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Récupérer les séances
        run: python -m cineparis scrape --days 7 $([ "${{ github.event_name }}" = "workflow_dispatch" ] && echo --resolve)
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if ! git diff --cached --quiet; then
            git commit -m "Séances du $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main   # au cas où quelqu'un a poussé pendant le scrape
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
